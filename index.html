<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Studio digital à Paris. Sites web sur mesure, conseil et identité de marque — du concret, fait pour vous, pas de modèle tout fait. Parlons de votre projet."
    />
    <meta name="author" content="Venio" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Venio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Venio" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://api.fontshare.com" />

    <!-- Satoshi font -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />

    <!-- Archivo (thème Monolithe — site public) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <title>Création de sites web sur mesure à Paris | Venio</title>
    <link rel="canonical" href="https://venio.paris/" />

    <!-- Open Graph / Twitter (fallback statique pour les robots sociaux sans JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Venio" />
    <meta property="og:title" content="Sites web sur mesure, conseil et marque à Paris | Venio" />
    <meta
      property="og:description"
      content="Studio digital à Paris. Sites web sur mesure, conseil et identité de marque — du concret, fait pour vous, pas de modèle tout fait."
    />
    <meta property="og:image" content="https://venio.paris/og-image.png" />
    <meta property="og:url" content="https://venio.paris/" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sites web sur mesure, conseil et marque à Paris | Venio" />
    <meta
      name="twitter:description"
      content="Studio digital à Paris. Sites web sur mesure, conseil et identité de marque — du concret, fait pour vous."
    />
    <meta name="twitter:image" content="https://venio.paris/og-image.png" />

    <link rel="stylesheet" href="/src/fonts.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
