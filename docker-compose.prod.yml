services:
  venio:
    build: .
    container_name: venio-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - uploads-data:/app/uploads
    environment:
      - NODE_ENV=production

volumes:
  uploads-data:
