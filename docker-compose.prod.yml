services:
  venio:
    build: .
    container_name: venio-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - /opt/docker/venio-files:/opt/docker/venio-files
      - venio-uploads:/app/uploads
    # Le HEALTHCHECK est défini dans le Dockerfile ; redondance ici pour `docker compose ps`
    # qui affichera `(healthy)` / `(unhealthy)` à côté du container.
    healthcheck:
      test: ['CMD-SHELL', "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  venio-uploads:
