<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Venio, Journée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#0a0c0f; --bg-card:#141a20; --bg-card-hover:#1b242c; --surface-raised:#202a33; --bg-panel:#0d1115;
  --border-color:rgba(224,238,247,.09); --line-soft:rgba(224,238,247,.07); --line-strong:rgba(224,238,247,.16);
  --text-primary:#e8eef3; --text-secondary:#9daab3; --text-muted:#8794a0;
  --primary-rgb:56,189,248; --primary:#38bdf8; --primary-light:#7dd3fc; --primary-dark:#0ea5e9; --primary-fg:#06202b;
  --accent-surface:rgba(var(--primary-rgb),.09); --accent-medium:rgba(var(--primary-rgb),.14); --accent-border:rgba(var(--primary-rgb),.34); --accent-ring:rgba(var(--primary-rgb),.55);
  --critical:#ff8a8a; --serious:#f4a06a; --warning:#f7c268; --good:#7fdba0;
  --r-sm:6px; --r-md:10px; --r-lg:13px; --r-pill:999px;
  --font-body:'Manrope','Cabinet Grotesk',system-ui,sans-serif; --font-mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--bg-primary);color:var(--text-primary);font:500 12.5px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure,blockquote{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px;border-radius:var(--r-sm)}
:focus-visible:is(h1){outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)} .soft{color:var(--text-secondary)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}.ic.lg{width:20px;height:20px}

/* coque */
.app-shell{display:grid;grid-template-columns:50px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-right:1px solid var(--border-color)}
.rail-logo{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-weight:800;font-size:15px;margin-bottom:8px}
.rail a{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--text-secondary)}
.rail a:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.rail a[aria-current="page"]{background:var(--accent-medium);color:var(--primary-light)}
.rail .grow{flex:1}
.shell-main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--border-color);min-height:56px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:12px;min-width:0;flex-wrap:wrap}
.crumbs a:hover{color:var(--text-primary)}
.crumbs [aria-current]{color:var(--text-primary);font-weight:700}
.crumbs .ic{width:12px;height:12px}
.topbar .sp{flex:1}
.cmd{display:flex;align-items:center;gap:8px;height:34px;width:320px;max-width:100%;padding:0 10px;border:1px solid var(--border-color);border-radius:var(--r-md);background:var(--bg-card);color:var(--text-muted)}
.cmd span{flex:1}
.kbd{background:var(--bg-card-hover);border-radius:var(--r-sm);color:var(--text-secondary);padding:1px 6px;font:11.5px var(--font-mono)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:var(--r-md);color:var(--text-secondary);position:relative}
.icon-btn:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.icon-btn .pip{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--primary)}
.lang{display:flex;background:var(--bg-card);border-radius:var(--r-md);padding:2px}
.lang button{border:0;background:transparent;border-radius:var(--r-sm);padding:4px 8px;font-size:11.5px;font-weight:700;color:var(--text-muted)}
.lang button[aria-pressed="true"]{background:var(--bg-card-hover);color:var(--text-primary)}
.content{padding:20px 28px 56px;min-width:0;max-width:1320px;width:100%}

/* moments */
.moments{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.moment{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--r-lg);background:var(--bg-card);min-width:0;position:relative}
.moment:hover{background:var(--bg-card-hover)}
.moment-ic{width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--surface-raised);color:var(--text-secondary);flex:none}
.moment-t{min-width:0}
.moment-t b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.moment-t span{display:block;color:var(--text-muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moment[aria-current="page"]{background:var(--accent-surface);border-color:var(--accent-border)}
.moment[aria-current="page"] .moment-ic{background:var(--primary);color:var(--primary-fg)}
.moment[aria-current="page"] .moment-t span{color:var(--text-secondary)}
.subtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border-color);margin-bottom:20px;scrollbar-width:thin}
.subtabs a{position:relative;flex:none;display:inline-flex;align-items:center;gap:8px;padding:11px 12px;color:var(--text-secondary);white-space:nowrap;font-weight:600}
.subtabs a:hover{color:var(--text-primary)}
.subtabs a[aria-current="page"]{color:var(--text-primary)}
.subtabs a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px;background:var(--primary)}
.subtabs .count{font:11.5px var(--font-mono);color:var(--text-muted)}
.subtabs .sp{flex:1}
.subtabs .plan-link{margin-left:auto;color:var(--text-muted);font-size:12px}

/* titres, boutons */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.page-head .lede{color:var(--text-secondary);margin-top:6px;max-width:64ch;font-size:13px}
.page-head .kicker{font:12px var(--font-mono);color:var(--text-muted);margin-bottom:6px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
.h3{font-size:13px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:7px 13px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:transparent;color:var(--text-primary);font-size:12px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--bg-card-hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{background:var(--primary-dark)}
.btn.soft{background:var(--accent-medium);border-color:var(--accent-border);color:var(--primary-light)}
.btn.soft:hover{background:rgba(var(--primary-rgb),.22)}
.btn.danger{background:rgba(255,138,138,.10);border-color:rgba(255,138,138,.32);color:var(--critical)}
.btn.danger:hover{background:rgba(255,138,138,.18)}
.btn.ghost{border-color:transparent;color:var(--text-secondary)}
.btn.ghost:hover{color:var(--text-primary)}
.btn.sm{min-height:26px;padding:4px 10px;font-size:11.5px;border-radius:var(--r-sm)}
.btn.big{min-height:40px;padding:10px 18px;font-size:13px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn[aria-pressed="true"]{background:var(--accent-medium);border-color:var(--accent-border);color:var(--primary-light)}

.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:var(--r-pill);border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);font-size:12px;font-weight:600;white-space:nowrap}
.pill:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.pill[aria-pressed="true"],.pill[aria-current="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.pill .n{font:11.5px var(--font-mono);opacity:.85}
.pill.dashed{border-style:dashed;color:var(--text-muted)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg-card);border-radius:var(--r-md);padding:3px;gap:2px;max-width:100%}
.seg button,.seg a{border:0;background:transparent;border-radius:var(--r-sm);padding:6px 12px;font-size:12px;font-weight:700;color:var(--text-secondary);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--bg-card-hover);color:var(--text-primary)}

.card{background:var(--bg-card);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:16px;min-width:0}
.card.flush{padding:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head .sub{color:var(--text-muted);font-size:11.5px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.grid-2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cols-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* chips, pastilles */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--tone,#9daab3) 15%,var(--bg-primary));color:var(--tone,#9daab3);white-space:nowrap}
.chip.red{--tone:var(--critical)}.chip.amber{--tone:var(--warning)}.chip.green{--tone:var(--good)}.chip.blue{--tone:var(--primary-light)}.chip.orange{--tone:var(--serious)}.chip.grey{--tone:#aab6bf}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--tone,#9daab3);flex:none;display:inline-block}
.dot.fill{background:var(--tone,#9daab3)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--primary-fg);display:inline-grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.avatar.grey{background:var(--surface-raised);color:var(--text-secondary)}
.avatar.lg{width:44px;height:44px;font-size:15px}
.heat{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12px}
.heat i{display:inline-flex;gap:2px}.heat i b{width:4px;height:12px;border-radius:2px;background:var(--surface-raised)}
.heat.hot{color:var(--serious)}.heat.hot i b.on{background:var(--serious)}
.heat.warm{color:var(--primary-light)}.heat.warm i b.on{background:var(--primary)}
.heat.cold{color:var(--text-secondary)}.heat.cold i b.on{background:#6c7a86}

/* bandeaux */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--tone) 7%,var(--bg-primary));border:1px solid color-mix(in srgb,var(--tone) 26%,transparent);--tone:var(--primary-light)}
.banner.red{--tone:var(--critical)}.banner.amber{--tone:var(--warning)}.banner.green{--tone:var(--good)}.banner.blue{--tone:var(--primary-light)}
.banner .ic{color:var(--tone);margin-top:2px}
.banner b{display:block;font-size:13px}
.banner p{color:var(--text-secondary);margin-top:2px}
.banner .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.banner > div{min-width:0}

/* tableaux */
.tbl-wrap{position:relative;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.tbl{min-width:720px}
.tbl th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11.5px;padding:9px 12px;border-bottom:1px solid var(--border-color);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr:hover{background:var(--bg-card-hover)}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tbl tfoot td{border-bottom:0;color:var(--text-secondary);font-weight:700}
.lead-link{font-weight:700}.lead-link:hover{color:var(--primary-light)}
.tbl select,.field select,.field input,.field textarea,.search input{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--r-md);padding:6px 9px;color:var(--text-primary);min-height:30px;max-width:100%}
.tbl select{padding:3px 6px;font-size:12px;background:transparent;border-color:transparent}
.tbl select:hover{border-color:var(--line-strong)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--primary);width:15px;height:15px}
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--accent-surface);border:1px solid var(--accent-border);border-radius:var(--r-md);margin-bottom:10px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search .ic{position:absolute;left:10px;top:8px;color:var(--text-muted)}
.search input{width:100%;padding-left:32px;min-height:32px}
.pop{position:absolute;z-index:20;background:var(--bg-card);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:10px;min-width:190px;margin-top:6px}
.pop label{display:flex;align-items:center;gap:9px;padding:5px 4px;font-weight:600}
.rel{position:relative}

/* champs */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lab{color:var(--text-muted);font-weight:600;font-size:11.5px}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field .hint{color:var(--text-muted);font-size:11.5px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.props{display:flex;flex-direction:column}
.props div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.props div:last-child{border-bottom:0}
.props dt{color:var(--text-muted);font-weight:600;flex:none}
.props dd{text-align:right;min-width:0;overflow-wrap:anywhere}
.props select{background:var(--bg-card-hover);border:1px solid var(--border-color);border-radius:var(--r-sm);padding:3px 6px;min-height:26px}
.switch{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:var(--r-pill);background:var(--surface-raised);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--text-secondary);transition:transform .15s}
.switch input:checked + span{background:var(--primary)}
.switch input:checked + span::after{transform:translateX(16px);background:var(--primary-fg)}
.switch input:focus-visible + span{outline:2px solid var(--accent-ring);outline-offset:2px}

/* états vides */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 20px;color:var(--text-secondary)}
.empty .ic{width:28px;height:28px;color:var(--text-muted)}
.empty b{color:var(--text-primary);font-size:14px}
.empty p{max-width:46ch}

/* aujourd'hui */
.now-card{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px;border-radius:var(--r-lg);background:var(--accent-surface);border:1px solid var(--accent-border);margin-bottom:14px}
.now-card .kick{display:flex;align-items:center;gap:8px;color:var(--primary-light);font-weight:700;margin-bottom:6px}
.now-card h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
.now-card p{color:var(--text-secondary);margin-top:4px;max-width:62ch}
.mix{display:flex;height:8px;border-radius:var(--r-pill);overflow:hidden;gap:2px;margin:10px 0 8px;background:var(--surface-raised)}
.mix i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.todo-list{display:flex;flex-direction:column}
.todo{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-radius:var(--r-md);margin:0 4px}
.todo + .todo{border-top:1px solid var(--line-soft)}
.todo:hover{background:var(--bg-card-hover)}
.todo .when{font:12px var(--font-mono);color:var(--text-muted);text-align:left}
.todo .what{color:var(--text-secondary);margin-top:2px}
.todo .t1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.todo .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.todo.is-done{opacity:.55}
.todo.is-done .lead-link{text-decoration:line-through}
.todo.rdv .when{color:var(--primary-light)}
.now-line{display:flex;align-items:center;gap:10px;margin:6px 14px;color:var(--primary-light);font:12px var(--font-mono)}
.now-line::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--primary);flex:none}
.now-line::after{content:"";flex:1;height:1px;background:var(--accent-border)}
.group-title{display:flex;align-items:center;gap:8px;padding:14px 18px 6px;font-size:12px;font-weight:600}
.group-title .n{color:var(--text-muted);font:11.5px var(--font-mono)}
.menu{position:absolute;right:0;top:100%;z-index:15;background:var(--bg-card);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:4px;min-width:170px;margin-top:4px}
.menu button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-secondary);font-weight:600}
.menu button:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.session-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.session-nums div{padding:10px 8px;border-radius:var(--r-md);background:var(--bg-panel)}
.session-nums b{display:block;font:500 24px/1 var(--font-mono);letter-spacing:-.03em}
.session-nums span{display:block;color:var(--text-muted);font-size:11.5px;margin-top:5px}
.meter{position:relative;height:8px;border-radius:var(--r-pill);background:var(--surface-raised);margin:8px 0}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-pill);background:var(--primary)}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text-primary);border-radius:2px;text-decoration:none}
.meter-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted)}

/* poste d'appel */
.mode-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode-card{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-lg);border:1px solid var(--line-soft);background:var(--bg-card);cursor:pointer;min-width:0}
.mode-card:hover{background:var(--bg-card-hover)}
.mode-card:has(input:checked){border-color:var(--accent-border);background:var(--accent-surface)}
.mode-card input{margin-top:2px}
.mode-card b{display:block;font-size:13px}
.mode-card span{display:block;color:var(--text-secondary);margin-top:2px}
.file-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-radius:var(--r-md);margin:0 6px;width:calc(100% - 12px);text-align:left;border:0;background:transparent}
.file-row + .file-row{border-top:1px solid var(--line-soft)}
.file-row:hover{background:var(--bg-card-hover)}
.file-row[aria-pressed="true"]{background:var(--accent-surface);box-shadow:inset 3px 0 0 -0px var(--primary)}
.file-row .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center;color:var(--text-muted)}
.file-row .loc{font:11.5px var(--font-mono);color:var(--text-secondary);text-align:right}
.file-row .loc.out{color:var(--critical)}
.cc{font:11px var(--font-mono);padding:1px 5px;border-radius:var(--r-sm);background:var(--surface-raised);color:var(--text-secondary)}
.callbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-lg);background:var(--bg-card);border:1px solid var(--accent-border);margin-bottom:14px}
.callbar .who{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 240px}
.callbar .timer{font:500 22px var(--font-mono);letter-spacing:-.02em}
.callbar .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rec{display:inline-flex;align-items:center;gap:7px;color:var(--critical);font-weight:700}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--critical);display:inline-block}
.live-log{display:flex;flex-direction:column;gap:10px;max-height:430px;overflow-y:auto;padding-right:6px}
.say{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px}
.say .ts{font:11.5px var(--font-mono);color:var(--text-muted);padding-top:3px}
.say .bubble{padding:8px 12px;border-radius:var(--r-md);background:var(--bg-panel);max-width:78ch}
.say.me .bubble{background:var(--accent-surface)}
.say .who{display:block;font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:1px}
.say mark{background:rgba(var(--primary-rgb),.22);color:var(--text-primary);border-radius:3px;padding:0 2px}
.typing{color:var(--text-muted);font-style:normal;display:inline-flex;gap:3px}
.keypad{display:grid;grid-template-columns:repeat(3,44px);gap:6px}
.keypad button{height:36px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--bg-card-hover);font:500 14px var(--font-mono)}
.result-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:var(--r-md);border:1px solid var(--line-soft);background:var(--bg-card);cursor:pointer}
.opt:has(input:checked){border-color:var(--accent-border);background:var(--accent-surface)}
.opt b{display:block}
.opt span{color:var(--text-secondary);display:block}
.opt.red:has(input:checked){border-color:rgba(255,138,138,.4);background:rgba(255,138,138,.08)}

/* pipeline */
.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line-soft);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px}
.stat-strip>div{background:var(--bg-card);padding:12px 16px;min-width:0}
.stat-strip b{display:block;font:500 22px/1.1 var(--font-mono);letter-spacing:-.03em}
.stat-strip span{color:var(--text-muted);font-size:11.5px;display:block;margin-top:4px}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;-webkit-overflow-scrolling:touch}
.kcol{flex:1 0 240px;min-width:0;background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:10px;min-height:200px}
.kcol.over{outline:2px dashed var(--accent-border)}
.kcol-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.kcol-head .tot{margin-left:auto;font:12px var(--font-mono);color:var(--text-secondary)}
.kcol-sub{display:flex;justify-content:space-between;color:var(--text-muted);padding:0 4px 10px;font-size:11.5px}
.kcard{display:block;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--r-lg);padding:12px;margin-bottom:8px;cursor:grab}
.kcard:hover{background:var(--bg-card-hover)}
.kcard.dragging{opacity:.4}
.kcard .nm{font-weight:700;display:block;margin-bottom:2px}
.kcard .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.kmore{display:block;text-align:center;border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:9px;color:var(--text-muted);font-size:11.5px}

/* fiche lead */
.lead-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lead-head h1{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.lead-head .id{display:flex;gap:14px;align-items:center;min-width:0;flex:1 1 340px}
.next-strip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-lg);background:var(--bg-card);border:1px solid var(--line-soft);margin-bottom:14px}
.next-strip .ic{color:var(--primary-light)}
.lead-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-color);margin-bottom:16px;overflow-x:auto}
.tabs button{position:relative;flex:none;border:0;background:transparent;padding:10px 12px;color:var(--text-secondary);font-weight:700;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text-primary)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--primary)}
.review-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.quote{border-radius:var(--r-md);background:var(--bg-panel);padding:12px 14px;color:var(--text-secondary);line-height:1.6}
.field-row{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.field-row:last-child{border-bottom:0}
.field-row .lab{color:var(--text-muted);font-weight:600;padding-top:2px}
.field-row .val{font-weight:700;font-size:13px;overflow-wrap:anywhere}
.field-row .cite{margin-top:4px;color:var(--text-secondary);font-size:12px}
.field-row .cite.un{color:var(--warning)}
.field-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.field-row[data-s="ok"] .val{color:var(--good)}
.field-row[data-s="no"] .val{color:var(--text-muted);text-decoration:line-through}
.field-row[data-s="no"]{opacity:.75}
.crit{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;gap:10px;align-items:center;padding:6px 0}
.crit .bar{height:8px;border-radius:var(--r-pill);background:var(--surface-raised);overflow:hidden}
.crit .bar i{display:block;height:100%;background:var(--primary);border-radius:var(--r-pill)}
.crit .sc{font:12px var(--font-mono);text-align:right;color:var(--text-secondary)}
.act-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.act-row:last-child{border-bottom:0}
.act-row .ico{width:30px;height:30px;border-radius:var(--r-md);background:var(--surface-raised);display:grid;place-items:center;color:var(--text-secondary)}
.act-row[data-s="ok"] .ico{background:var(--accent-medium);color:var(--primary-light)}
.act-row[data-s="no"]{opacity:.55}
.validate-bar{position:sticky;bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-lg);background:var(--bg-card);border:1px solid var(--accent-border);margin-top:16px;z-index:5}
details.panel{border:1px solid var(--line-soft);border-radius:var(--r-lg);background:var(--bg-card)}
details.panel>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .ic.chev{margin-left:auto;transition:transform .15s}
details.panel[open]>summary .ic.chev{transform:rotate(90deg)}
details.panel>.inner{padding:2px 14px 14px}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chain span{padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--border-color);color:var(--text-muted);font-weight:600;font-size:11.5px}
.chain span.on{background:var(--accent-medium);border-color:var(--accent-border);color:var(--primary-light)}
.chain span.cur{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.chain .ic{width:12px;height:12px;color:var(--text-muted)}
.timeline li{display:grid;grid-template-columns:96px 22px minmax(0,1fr);gap:8px;padding:9px 0}
.timeline .d{font:11.5px var(--font-mono);color:var(--text-muted);padding-top:2px}
.timeline .ico{color:var(--text-secondary);padding-top:1px}
.timeline b{display:block}

/* pilotage */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11px var(--font-mono);fill:var(--text-muted)}
.chart .tip{position:absolute;pointer-events:none;background:var(--bg-card-hover);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:7px 10px;font:11.5px var(--font-mono);white-space:nowrap;display:none;z-index:3;color:var(--text-primary)}
.chart .tip small{display:block;color:var(--text-secondary);font:inherit}
.fun{display:flex;flex-direction:column;gap:8px}
.fun-row{display:grid;grid-template-columns:96px minmax(0,1fr) 120px;gap:10px;align-items:center}
.fun-row .bar{height:22px;border-radius:var(--r-sm);background:var(--surface-raised);overflow:hidden}
.fun-row .bar i{display:block;height:100%;background:var(--primary);border-radius:var(--r-sm)}
.fun-row .v{text-align:right;font:12px var(--font-mono);color:var(--text-secondary)}
.obj{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.obj:last-child{border-bottom:0}
.obj-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.obj-top b{font:500 20px var(--font-mono);letter-spacing:-.03em}
.week-card{padding:14px;border-radius:var(--r-lg);background:var(--bg-panel)}
.kpi{font:500 28px/1.1 var(--font-mono);letter-spacing:-.03em}
.quote-list li{padding:10px 12px;border-radius:var(--r-md);background:var(--bg-panel)}
.quote-list li + li{margin-top:8px}
.change{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.change div{padding:10px 12px;border-radius:var(--r-md);background:var(--bg-panel)}
.change .lab{color:var(--text-muted);font-weight:600;font-size:11.5px;display:block;margin-bottom:3px}

/* automatisations */
.rule{border:1px solid var(--line-soft);border-radius:var(--r-lg);background:var(--bg-card);margin-bottom:10px}
.rule-top{display:flex;gap:14px;align-items:center;padding:14px;flex-wrap:wrap}
.rule-top .t{flex:1 1 260px;min-width:0}
.rule-flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 14px 14px}
.rule-flow .step{padding:6px 10px;border-radius:var(--r-md);background:var(--bg-panel);color:var(--text-secondary)}
.rule-flow .step b{color:var(--text-primary);display:block}
.tpl{padding:14px;border-radius:var(--r-lg);border:1px solid var(--line-soft);background:var(--bg-card);display:flex;flex-direction:column;gap:8px}
.seq-steps li{display:grid;grid-template-columns:54px 26px minmax(0,1fr);gap:10px;padding:8px 0;align-items:start}
.seq-steps .d{font:11.5px var(--font-mono);color:var(--text-muted);padding-top:3px}

/* réglages */
.set-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.set-nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.set-nav h3{font-size:11.5px;color:var(--text-muted);font-weight:600;padding:12px 10px 4px}
.set-nav a{display:block;padding:7px 10px;border-radius:var(--r-md);color:var(--text-secondary);font-weight:600}
.set-nav a:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.set-nav a[aria-current="page"]{background:var(--accent-surface);color:var(--text-primary);box-shadow:inset 3px 0 0 -0px var(--primary)}
.set-jump{display:none}
.set-row{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.set-row:last-child{border-bottom:0}
.set-row .t{min-width:0;flex:1}
.set-row .t b{display:block}
.set-row .t span{color:var(--text-muted);display:block;margin-top:1px}
.set-row .ctl{flex:none;display:flex;gap:8px;align-items:center}
.set-row input[type="number"],.set-row input[type="text"],.set-row select{background:var(--bg-panel);border:1px solid var(--border-color);border-radius:var(--r-md);padding:5px 9px;min-height:30px;width:130px}
.set-row input[type="number"]{font-family:var(--font-mono);text-align:right;width:84px}

/* plan */
.plan-row td{vertical-align:top}
.plan-row .where a{display:inline-flex;gap:6px;align-items:center;color:var(--primary-light);font-weight:700;margin-right:12px}
.plan-row .where a:hover{text-decoration:underline}
.plan-row .old{font-weight:700}
.plan-row .detail{color:var(--text-secondary);margin-top:3px}
.moment-tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:var(--r-pill);background:var(--accent-surface);color:var(--primary-light);font-weight:700;font-size:11.5px;white-space:nowrap}

/* modale, toast */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--r-lg);padding:20px}
.modal h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.modal p{color:var(--text-secondary)}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--bg-card-hover);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:10px 16px;z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast .ic{color:var(--good)}

@media (max-width:1100px){
  .grid-2,.lead-grid{grid-template-columns:minmax(0,1fr)}
  .moment-t span{display:none}
  .cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmd{display:none}
}
@media (max-width:900px){
  .set-grid{grid-template-columns:minmax(0,1fr)}
  .set-nav{display:none}
  .set-jump{display:block;margin-bottom:12px}
  .set-jump select{width:100%;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--r-md);padding:9px 10px;min-height:40px}
  .cols-3,.mode-cards,.grid-2.even{grid-template-columns:minmax(0,1fr)}
  .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .app-shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;padding:6px 10px;border-right:0;border-bottom:1px solid var(--border-color);overflow-x:auto;gap:4px}
  .rail-logo{margin:0 8px 0 0}
  .rail .grow{display:none}
  .topbar{padding:10px 16px;flex-wrap:wrap}
  .content{padding:14px 16px 56px}
  .moments{gap:6px}
  .moment{flex-direction:column;align-items:flex-start;gap:6px;padding:10px 8px}
  .moment-ic{width:28px;height:28px}
  .moment-t b{font-size:12.5px}
  .page-head h1,.lead-head h1{font-size:22px}
  .todo{grid-template-columns:minmax(0,1fr);gap:6px}
  .todo .acts{justify-content:flex-start}
  .field-row{grid-template-columns:minmax(0,1fr)}
  .field-row .acts{justify-content:flex-start}
  .form-grid,.result-opts,.change,.cols-4{grid-template-columns:minmax(0,1fr)}
  .crit{grid-template-columns:90px minmax(0,1fr) 48px}
  .fun-row{grid-template-columns:78px minmax(0,1fr) 92px}
  .file-row{grid-template-columns:22px minmax(0,1fr)}
  .file-row .loc{grid-column:2;text-align:left}
  .timeline li{grid-template-columns:70px 18px minmax(0,1fr)}
  .set-row{flex-direction:column;align-items:flex-start;gap:8px}
  .kcol{flex:0 0 244px}
  .lang{display:none}
  .btn,.pill,.seg button,.icon-btn{min-height:40px}
  .btn.sm{min-height:34px}
  .stat-strip b{font-size:18px}
  .callbar .timer{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

function localTime(l) {

}

/* typographie française : espaces insécables */
function typo(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentElement.tagName)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const t = n.nodeValue.replace(/ ([:;?!»])/g, ' $1').replace(/« /g, '« ').replace(/(\d) (?=(h|€|%|min|j|jours?)(?![\p{L}]))/gu, '$1 ').replace(/\b(h|min) (\d)/g, '$1 $2');

}

let lastKey = null, callTimer = null;
function render(keep) {
  const r = parseRoute(), y = window.scrollY;
  clearInterval(callTimer);
  let body = '';
  switch (r.key) {
    case 'aujourdhui': body = r.tab === 'semaine' ? vWeek() : r.tab === 'filer' ? vKeep() : vToday(); break;
    case 'poste': body = vDesk(); break;
    case 'appel': body = vCall(); break;
    case 'resultat': body = vResult(); break;
    case 'scripts': body = vScripts(); break;
    case 'pipeline': body = vPipelineTable(); break;
    case 'kanban': body = vKanban(); break;
    case 'comptes': body = vAccounts(); break;
    case 'partenaires': body = vPartners(); break;
    case 'lead': body = vLead(r.id); break;
    case 'previsions': body = vForecast(); break;
    case 'auto': body = vAuto(); break;
    case 'reglages': body = vSettings(r.sec); break;
    case 'plan': body = vPlan(); break;
  }
  const app = $('#app'); app.innerHTML = shell(r, body);
  $('#layer').innerHTML = modalHtml();
  typo(app); typo($('#layer'));
  if (r.key === 'previsions') bindChart(app);
  if (r.key === 'appel') startCall();
  if (r.key === 'reglages') bindHeat();
  if (r.key === 'kanban') bindKanban();
  const q = $('#q'); if (q) q.addEventListener('input', e => { S.q = e.target.value; $('#tbody').innerHTML = tableBody(); typo($('#tbody')); const a = filteredLeads(); $('#tcount').textContent = tcountText(a).replace(/ ([:;?!»])/g, '\u00a0$1'); });
  document.title = 'CRM Venio, Journée';
  if (keep && lastKey === r.key + (r.id || '')) window.scrollTo(0, y); else { window.scrollTo(0, 0); const h = $('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
  lastKey = r.key + (r.id || '');
  const mo = $('.modal'); if (mo) { const f = $('button:not(.ghost), input, select, textarea', mo) || $('button', mo); f && f.focus(); }
}
function startCall() {
  const l = LEAD[S.picked] || LEAD.osteo, lines = callLines(l.id);
  callTimer = setInterval(() => {
    S.callSecs++; const t = $('#call-timer'); if (t) t.textContent = mmss(S.callSecs);
    const log = $('#live-log'); if (!log) return;
    const want = lines.filter(x => x[0] <= S.callSecs), have = $$('.say', log).length;
    if (want.length > have) { want.slice(have).forEach(x => log.insertAdjacentHTML('beforeend', sayHtml(x, l))); typo(log); log.scrollTop = log.scrollHeight; }
  }, 1000);
  const log = $('#live-log'); if (log) log.scrollTop = log.scrollHeight;
}
function bindHeat() {
  $$('[data-heat]').forEach(i => i.addEventListener('input', () => {
    S.heatw[i.dataset.heat] = +i.value || 0;
    const t = Object.values(S.heatw).reduce((a, b) => a + b, 0);
    $('#heat-total').textContent = t;
    const ok = $('#heat-ok'); ok.className = 'chip ' + (t === 100 ? 'green' : 'amber');
    ok.innerHTML = (t === 100 ? ic('check', 'sm') + ' La somme est de 100' : ic('alert', 'sm') + ' La somme doit faire 100 : il manque ' + (100 - t) + ' points'.replace('il manque -', 'il y a trop de '));
    if (t > 100) ok.innerHTML = ic('alert', 'sm') + ' La somme doit faire 100 : ' + (t - 100) + ' points en trop';
    if (t < 100) ok.innerHTML = ic('alert', 'sm') + ' La somme doit faire 100 : il manque ' + (100 - t) + ' points';
    typo(ok);
  }));
}
function bindKanban() {
  $$('.kcard').forEach(c => { c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); }); c.addEventListener('dragend', () => c.classList.remove('dragging')); });
  $$('.kcol').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (LEAD[id] && S.st[id] !== col.dataset.col) { S.st[id] = col.dataset.col; render(true); toast(`${LEAD[id].name} passe en ${ST[col.dataset.col].label}`); } });
  });
}

function act(el, ev) {
  const a = el.dataset.act, id = el.dataset.id, k = el.dataset.k, v = el.dataset.v;
  let keep = true;
  switch (a) {
    case 'call': { const l = LEAD[id]; if (outOfRange(l)) { toast('Hors plage chez le prospect : appel possible à partir de 14 h 00'); break; } S.picked = id; S.callSecs = id === 'osteo' ? 98 : 62; S.muted = false; S.keypad = false; S.callEnd = null; keep = false; go('#/prospecter/appel'); return; }
    case 'done': S.done[id] = true; S.menu = null; render(true); toast('Marqué comme fait'); return;
    case 'postpone': S.done[id] = 'post'; S.menu = null; render(true); toast(`Reporté : ${el.dataset.to.toLowerCase()}`); return;
    case 'menu': S.menu = S.menu === id ? null : id; break;
    case 'more': S.menu = S.menu === 'more' ? null : 'more'; break;
    case 'log': S.modal = { t: 'log', id }; S.menu = null; break;
    case 'modal': S.modal = { t: el.dataset.m }; S.menu = null; break;
    case 'create': S.modal = { t: 'create' }; break;
    case 'closemodal': S.modal = null; break;
    case 'veil': if (ev.target !== el) return; S.modal = null; break;
    case 'hold': S.hold = v; S.modal = null; render(true); toast(v === 'confirmed' ? 'Opposition confirmée' : 'Retenue levée'); return;
    case 'pick': S.picked = id; break;
    case 'scope': S.scope = v; break;
    case 'cat': S.fileCat = v; break;
    case 'view': S.view = v; S.q = ''; break;
    case 'clearq': S.q = ''; break;
    case 'cols': S.colsOpen = !S.colsOpen; break;
    case 'selclear': S.sel.clear(); break;
    case 'export': toast(S.sel.size ? `Export CSV de ${S.sel.size} leads prêt` : 'Export CSV prêt'); return;
    case 'page': toast('Maquette : les 30 autres leads ne sont pas dessinés'); return;
    case 'addfilter': toast('Filtre ajouté : choisissez un champ'); return;
    case 'bulkdelete': S.sel.clear(); S.modal = null; render(true); toast('Leads supprimés'); return;
    case 'ltab': S.leadTab = v; break;
    case 'fok': S.fields[k].s = 'ok'; break;
    case 'fno': S.fields[k].s = 'no'; break;
    case 'freset': S.fields[k].s = 'pending'; break;
    case 'fedit': S.editing = k; render(true); { const i = $('#ed-' + k); i && (i.focus(), i.select()); } return;
    case 'fsave': { const i = $('#ed-' + k); if (i && i.value.trim()) S.fields[k].v = i.value.trim(); S.fields[k].s = 'ok'; S.editing = null; break; }
    case 'fcancel': S.editing = null; break;
    case 'aok': S.acts[k] = 'ok'; break;
    case 'ano': S.acts[k] = 'no'; break;
    case 'areset': S.acts[k] = 'pending'; break;
    case 'validate': S.validated = true; render(true); toast('Analyse validée, 11 devient 10 éléments à traiter'); return;
    case 'valsimple': S.done[id] = true; render(true); toast('Analyse validée'); return;
    case 'mute': S.muted = !S.muted; break;
    case 'keypad': S.keypad = !S.keypad; break;
    case 'oppose': S.modal = { t: 'opp-call' }; break;
    case 'oppconfirm': S.callEnd = 'opp'; S.modal = null; go('#/prospecter/resultat'); return;
    case 'hangup': S.callEnd = 'hangup'; go('#/prospecter/resultat'); return;
    case 'saveResult': { const done = TODO.find(t => t.lead === S.picked); if (done) S.done[done.id] = true; const opp = S.callEnd === 'opp'; S.callEnd = null; S.picked = 'sablon'; go('#/prospecter/poste'); toast(opp ? 'Opposition enregistrée, numéro ajouté aux numéros opposés' : 'Échange enregistré'); return; }
    case 'period': S.period = +v; break;
    case 'week': S.week = +v; break;
    case 'atab': S.autoTab = v; break;
    case 'jfilter': S.journal = v; break;
    case 'sim': S.sim[id] = !S.sim[id]; break;
    case 'openrule': S.openRule = S.openRule === id ? null : id; break;
    case 'toast': if (el.dataset.close) S.modal = null; render(true); toast(el.dataset.msg); return;
    default: return;
  }
  render(keep);
}
document.addEventListener('click', ev => {
  const t = ev.target;
  let dirty = false;
  if ((S.menu || S.colsOpen || S.keypad) && !t.closest('.rel')) { S.menu = null; S.colsOpen = false; S.keypad = false; dirty = true; }
  const el = t.closest('[data-act]');
  if (!el || el.matches('select, input[type=checkbox], input[type=radio], details')) { if (dirty) render(true); return; }
  if (el.tagName === 'A') ev.preventDefault();
  act(el, ev);
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'mode') { S.mode = el.value; render(true); }
  else if (a === 'result') { S.resultPick = el.value; S.callEnd = el.value === 'opp' ? 'opp' : null; render(true); }
  else if (a === 'sel') { el.checked ? S.sel.add(id) : S.sel.delete(id); render(true); }
  else if (a === 'col') { S.cols[el.dataset.k] = el.checked ? 1 : 0; render(true); }
  else if (a === 'setst') { S.st[id] = el.value; render(true); toast(`${LEAD[id].name} passe en ${ST[el.value].label}`); }
  else if (a === 'setown') { LEAD[id].owner = el.value; toast(`Fiche assignée à ${el.value}`); }
  else if (a === 'bulkown' && el.value) { toast(`${S.sel.size} leads assignés à ${el.value}`); S.sel.clear(); render(true); }
  else if (a === 'bulkst' && el.value) { S.sel.forEach(i => S.st[i] = el.value); toast(`${S.sel.size} leads passent en ${ST[el.value].label}`); S.sel.clear(); render(true); }
  else if (a === 'rule') { const r = RULES.find(x => x.id === id); r.on = el.checked; toast(r.on ? 'Règle activée' : 'Règle désactivée'); }
  else if (a === 'jump') go('#/piloter/reglages/' + el.value);
});
document.addEventListener('toggle', ev => { if (ev.target.matches && ev.target.matches('details[data-act="tr"]')) S.transcriptOpen = ev.target.open; }, true);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.modal) { S.modal = null; render(true); }
  if (ev.key === 'Enter' && S.editing && ev.target.id === 'ed-' + S.editing) { ev.preventDefault(); act($(`[data-act="fsave"][data-k="${S.editing}"]`), ev); }
  if (ev.key === 'Tab' && S.modal) { const f = $$('button, input, select, textarea', $('.modal')).filter(x => !x.disabled); if (!f.length) return; const first = f[0], last = f[f.length - 1]; if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); } else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); } }
});
window.addEventListener('hashchange', () => { S.menu = null; S.colsOpen = false; S.keypad = false; S.modal = null; S.editing = null; render(false); });
render(false);
</script>
