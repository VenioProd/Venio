<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Venio Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f;--card:#141a20;--hover:#1b242c;--raised:#202a33;--panel:#0d1115;
  --border:rgba(224,238,247,.09);--hair:rgba(224,238,247,.07);--line:rgba(224,238,247,.16);
  --t1:#e8eef3;--t2:#9daab3;--t3:#8392a0;
  --p-rgb:56,189,248;--pl-rgb:125,211,252;--pd-rgb:14,165,233;
  --p:rgb(var(--p-rgb));--pl:rgb(var(--pl-rgb));--pd:rgb(var(--pd-rgb));--pfg:#06202b;
  --surf:rgba(var(--p-rgb),.09);--soft:rgba(var(--p-rgb),.14);--soft-b:rgba(var(--p-rgb),.34);--ring:rgba(var(--p-rgb),.55);
  --crit:#ff8a8a;--serious:#f4a06a;--warn:#f7c268;--good:#7fdba0;
  --r-sm:6px;--r-md:10px;--r-lg:13px;--rail:50px;--dock-h:56px;--top-h:52px;
  --font:'Manrope','Cabinet Grotesk',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:500 12.5px/1.5 var(--font);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pl);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:13px;height:13px}
svg.ic.lg{width:20px;height:20px}

/* coque */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;z-index:40}
.rail .logo{width:30px;height:30px;border-radius:50%;background:var(--p);color:var(--pfg);display:grid;place-items:center;font-weight:800;font-size:13px;margin-bottom:8px}
.rail button,.rail a.railbtn{width:36px;height:36px;border-radius:var(--r-md);border:0;background:transparent;color:var(--t2);display:grid;place-items:center;position:relative}
.rail button:hover,.rail a.railbtn:hover{background:var(--hover);color:var(--t1);text-decoration:none}
.rail .on{background:var(--soft);color:var(--pl)}
.rail .on::before{content:"";position:absolute;left:-7px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--p)}
.rail .spacer{flex:1}
.main{min-width:0;padding-bottom:calc(var(--dock-h) + 16px)}
.topbar{position:sticky;top:0;z-index:30;height:var(--top-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px}
.crumbs{overflow:hidden;display:flex;align-items:center;gap:6px;color:var(--t3);font-size:12px;font-weight:600;min-width:0;white-space:nowrap}
.crumbs a{color:var(--t2)}
.crumbs b{color:var(--t1);font-weight:700}
.topbar .grow{flex:1}
.cmd{display:flex;align-items:center;gap:8px;width:min(360px,34vw);height:34px;padding:0 10px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);color:var(--t3)}
.cmd input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--t1)}
.cmd:focus-within{box-shadow:0 0 0 2px var(--ring)}
.kbd{font:500 11px var(--mono);background:var(--hover);color:var(--t2);padding:1px 6px;border-radius:var(--r-sm)}
.iconbtn{width:34px;height:34px;border-radius:var(--r-md);border:0;background:transparent;color:var(--t2);display:grid;place-items:center;position:relative}
.iconbtn:hover{background:var(--hover);color:var(--t1)}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--p);border:2px solid var(--bg)}
.lang{display:flex;background:var(--card);border-radius:var(--r-md);padding:2px}
.lang button{border:0;background:transparent;color:var(--t2);font-weight:700;font-size:11.5px;padding:4px 8px;border-radius:var(--r-sm)}
.lang .on{background:var(--hover);color:var(--t1)}
.menubtn{display:none}
.dockbar .show-m{display:none}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r-md);border:1px solid var(--line);background:transparent;color:var(--t1);font-weight:700;font-size:12px;padding:7px 13px;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.primary{background:var(--p);border-color:var(--p);color:var(--pfg)}
.btn.primary:hover{background:var(--pd);border-color:var(--pd)}
.btn.soft{background:var(--soft);border-color:var(--soft-b);color:var(--pl)}
.btn.soft:hover{background:rgba(var(--p-rgb),.2)}
.btn.danger{background:rgba(255,138,138,.10);border-color:rgba(255,138,138,.32);color:var(--crit)}
.btn.danger:hover{background:rgba(255,138,138,.16)}
.btn.ghost{border-color:transparent;color:var(--t2)}
.btn.ghost:hover{color:var(--t1)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:var(--r-sm)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.good{background:rgba(127,219,160,.10);border-color:rgba(127,219,160,.32);color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--t2);font-weight:600;font-size:12px;padding:5px 13px;white-space:nowrap}
.pill:hover{background:var(--hover);color:var(--t1);text-decoration:none}
.pill.on{background:var(--p);border-color:var(--p);color:var(--pfg)}
.pill .cnt{font:500 11px var(--mono);opacity:.9}
.pill.dash{border-style:dashed;color:var(--t3)}
.seg{display:inline-flex;background:var(--card);border-radius:var(--r-md);padding:3px;gap:2px}
.seg button,.seg a{border:0;background:transparent;color:var(--t2);font-weight:700;font-size:12px;padding:5px 11px;border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg .on{background:var(--hover);color:var(--t1)}
.seg a:hover{text-decoration:none;color:var(--t1)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--c,#93a1ab) 15%,var(--bg));color:var(--c,#b4c0c8);white-space:nowrap}
.tag.crit{--c:var(--crit)}.tag.warn{--c:var(--warn)}.tag.good{--c:var(--good)}.tag.acc{--c:var(--pl)}.tag.ser{--c:var(--serious)}
.sdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--pl);flex:none;display:inline-block}
.sdot.s1{border-color:#8392a0}.sdot.s2{border-color:#9bb3c2}.sdot.s3{border-color:#7dd3fc}.sdot.s4{border-color:#4cb7ea}.sdot.s5{border-color:#38bdf8;background:rgba(56,189,248,.35)}
.sdot.won{background:var(--good);border-color:var(--good)}.sdot.lost{background:var(--crit);border-color:var(--crit)}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--p);color:var(--pfg);font-weight:800;font-size:10px;display:inline-grid;place-items:center;flex:none}
.avatar.alt{background:var(--raised);color:var(--t1)}
.avatar.lg{width:34px;height:34px;font-size:12px}
.avatar.none{background:transparent;border:1.5px dashed var(--t3);color:var(--t3)}

/* en-tête de scène */
.scene{padding:16px 18px 0;min-width:0}
.crmhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.crmhead h1{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.crmhead .grow{flex:1}
.cfgbtn{position:relative}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters .sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.searchbox{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);color:var(--t3);min-width:200px}
.searchbox input{background:transparent;border:0;outline:0;flex:1;min-width:0;color:var(--t1)}
.searchbox:focus-within{box-shadow:0 0 0 2px var(--ring)}

/* bandeau de pilotage */
.banner{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-lg);margin-bottom:12px}
.banner-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:center;gap:6px}
.kpi{padding:11px 16px;min-width:0}
.kpi .lab{color:var(--t3);font-weight:600;font-size:11.5px}
.kpi .val{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--t2);font-size:11.5px;font-variant-numeric:tabular-nums}
.kpi + .kpi{border-left:1px solid var(--hair)}
.meter{height:6px;border-radius:6px;background:var(--raised);position:relative;margin-top:5px;overflow:visible}
.meter i{display:block;height:100%;border-radius:6px;background:var(--p)}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--t1);border-radius:2px}
.banner-toggle{margin:0 12px}
.unfold{border-top:1px solid var(--hair);padding:14px 16px 16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tabs a,.tabs button{border:0;background:transparent;color:var(--t2);font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:var(--r-md) var(--r-md) 0 0;position:relative;white-space:nowrap}
.tabs a:hover{text-decoration:none;color:var(--t1)}
.tabs .on{color:var(--t1)}
.tabs .on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--p)}

/* cartes génériques */
.panel{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-lg);padding:14px 16px;min-width:0}
.panel h2,.panel h3{font-size:14px;font-weight:800;letter-spacing:-.01em}
.panel .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.panel .hint{color:var(--t3);font-size:11.5px;font-weight:600}
.h-page{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.h-sec{font-size:17px;font-weight:800;letter-spacing:-.02em}
.lede{color:var(--t2);max-width:68ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.muted{color:var(--t3)}
.soft-t{color:var(--t2)}
.sep-line{height:1px;background:var(--border);margin:10px 0}

/* kanban */
.board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--card);border-radius:var(--r-lg);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.col-head b{font-size:12.5px;font-weight:700}
.col-head .cnt{color:var(--t3);font:500 11.5px var(--mono)}
.col-head .amt{margin-left:auto;font:500 11.5px var(--mono);color:var(--t2)}
.lcard{background:var(--hover);border-radius:var(--r-md);padding:10px 11px;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;width:100%;color:var(--t1)}
.lcard:hover{background:var(--raised);text-decoration:none}
.lcard.sel{box-shadow:inset 3px 0 0 var(--p);background:var(--surf)}
.lcard .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lcard .co{font-weight:700;font-size:13px;line-height:1.3}
.lcard .ct{color:var(--t2);font-size:12px}
.lcard .amt{font:500 12px var(--mono);white-space:nowrap}
.lcard .flags{display:flex;flex-wrap:wrap;gap:4px}
.lcard .foot{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:11.5px;font-weight:600}
.more{border:1px dashed var(--line);background:transparent;color:var(--t2);border-radius:var(--r-md);padding:8px;font-size:12px;font-weight:600;text-align:center}
.more:hover{background:var(--hover);color:var(--t1)}
.coldrop{color:var(--t3);font-size:12px;text-align:center;padding:14px 6px;border:1px dashed var(--border);border-radius:var(--r-md)}

/* tableau */
.tablewrap{background:var(--card);border-radius:var(--r-lg);overflow:auto;border:1px solid var(--hair)}
table.tbl{border-collapse:collapse;width:100%;min-width:980px}
table.tbl th{text-align:left;color:var(--t3);font-weight:600;font-size:11.5px;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card);position:sticky;top:0}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--hair);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover td{background:var(--hover)}
table.tbl tr.rowsel td{background:var(--surf)}
table.tbl td.r,table.tbl th.r{text-align:right}
table.tbl .linkcell{background:transparent;border:0;padding:0;font-weight:700;color:var(--t1);text-align:left}
table.tbl .linkcell:hover{color:var(--pl);text-decoration:underline}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;color:var(--t2);font-size:12px;border-top:1px solid var(--border);flex-wrap:wrap}
.bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--surf);border-radius:var(--r-md);margin-bottom:10px}
.chk{width:16px;height:16px;accent-color:#38bdf8}
.inl{background:transparent;border:1px solid transparent;border-radius:var(--r-sm);padding:3px 5px;color:var(--t1);font-weight:600;max-width:140px}
.inl:hover{border-color:var(--line)}

/* à traiter */
.wl-group{margin-bottom:14px}
.wl-head{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12.5px;font-weight:700}
.wl-head .cnt{color:var(--t3);font:500 11.5px var(--mono)}
.wl-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:10px 14px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:10px 14px;margin-bottom:6px}
.wl-row.done{opacity:.45}
.wl-row .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.wl-row .who button{background:transparent;border:0;padding:0;text-align:left;font-weight:700;font-size:13px;color:var(--t1)}
.wl-row .who button:hover{color:var(--pl);text-decoration:underline}
.wl-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.wl-note{grid-column:1/-1;display:none;gap:8px}
.wl-note.open{display:flex}
.wl-note input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:7px 10px}

/* champs */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lab{color:var(--t3);font-weight:600;font-size:11.5px}
.field .help{color:var(--t3);font-size:11.5px}
.input,.select,.textarea{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:7px 10px;color:var(--t1);width:100%;min-width:0}
.panel .input,.panel .select,.panel .textarea,.drawer .input,.drawer .select,.drawer .textarea,.modal .input,.modal .select,.modal .textarea{background:var(--bg)}
.input:focus,.select:focus,.textarea:focus{outline:0;box-shadow:0 0 0 2px var(--ring)}
.textarea{resize:vertical;min-height:70px}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw{width:34px;height:20px;border-radius:999px;background:var(--raised);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--t2);transition:transform .15s,background .15s}
.toggle input:checked + .sw{background:var(--p)}
.toggle input:checked + .sw::after{transform:translateX(14px);background:var(--pfg)}
.toggle input:focus-visible + .sw{outline:2px solid var(--ring);outline-offset:2px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:6px 24px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.setrow:last-child{border-bottom:0}
.setrow .l b{display:block;font-weight:700;font-size:12.5px}
.setrow .l span{color:var(--t3);font-size:11.5px}

/* tiroir fiche */
.scrim{position:fixed;left:var(--rail);right:0;top:var(--top-h);bottom:0;background:rgba(0,0,0,.35);z-index:44}
.drawer{position:fixed;right:0;top:var(--top-h);bottom:var(--dock-h);width:min(960px,calc(100vw - var(--rail) - 60px));background:var(--panel);border-left:1px solid var(--border);z-index:50;display:flex;flex-direction:column}
.drawer-top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.drawer-top .grow{flex:1}
.drawer-body{flex:1;overflow:auto;padding:16px}
.dhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.dhead h1{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.dhead .info{flex:1;min-width:220px}
.props{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--hair);border-radius:var(--r-lg);margin-bottom:14px;background:var(--card)}
.prop{padding:10px 14px;border-right:1px solid var(--hair);min-width:0}
.prop:last-child{border-right:0}
.prop .lab{color:var(--t3);font-weight:600;font-size:11.5px}
.prop .v{font-weight:700;margin-top:2px}
.dcols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper button{border:1px solid var(--line);background:transparent;color:var(--t2);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:600}
.stepper .on{background:var(--soft);border-color:var(--soft-b);color:var(--pl)}
.stepper .past{color:var(--t1)}
.kvs{display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--t3);font-weight:600}
.kv span:last-child{text-align:right;font-weight:600}
.banner-alert{border-radius:var(--r-lg);padding:11px 14px;display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--c) 7%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.banner-alert.crit{--c:var(--crit)}.banner-alert.warn{--c:var(--warn)}.banner-alert.acc{--c:var(--pl)}.banner-alert.good{--c:var(--good)}
.banner-alert .ic{color:var(--c);margin-top:2px}
.banner-alert b{display:block}
.banner-alert .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* analyse */
.analysis{display:flex;flex-direction:column;gap:12px}
.fld{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:6px 14px;padding:11px 0;border-bottom:1px solid var(--hair);align-items:start}
.fld:last-child{border-bottom:0}
.fld .name{color:var(--t3);font-weight:600;font-size:11.5px;padding-top:2px}
.fld .prop-v{font-weight:700}
.fld .cur{color:var(--t3);font-size:11.5px;margin-top:2px}
.fld .quote{margin-top:6px;color:var(--t2);font-size:12px;font-style:normal;padding-left:10px;border-left:2px solid var(--line)}
.fld .quote.unv{border-left-color:var(--warn)}

function drawChart(el){

  const W = Math.max(280, Math.round(el.clientWidth || 600)), Ht = +(el.dataset.h || 300);

  const areaBot = Ht - padB - volH - gap, volTop = Ht - padB - volH, volBot = Ht - padB;
  const n = D.labels.length, band = (W - padL - padR) / n, xs = D.labels.map((_, i) => padL + (i + .5) * band);
  const lo = Math.floor(Math.min(...D.area) * .95 / 10000) * 10000, hi = Math.ceil(Math.max(...D.area) * 1.02 / 10000) * 10000;
  const ay = v => areaBot - (v - lo) / (hi - lo) * (areaBot - padT);
  const vmax = Math.max(...D.vol) * 1.08, vy = v => volBot - v / vmax * volH;
  let s = '<svg viewBox="0 0 ' + W + ' ' + Ht + '" width="' + W + '" height="' + Ht + '" focusable="false" aria-hidden="true">';
  if(showArea){
    for(let v = lo; v <= hi; v += 10000){ s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + ay(v) + '" y2="' + ay(v) + '" stroke="rgba(224,238,247,.07)"/><text x="' + (padL - 8) + '" y="' + (ay(v) + 4) + '" text-anchor="end" font-family="DM Mono" font-size="11" fill="#8392a0">' + (v / 1000) + ' k€</text>'; }
    const pts = D.area.map((v, i) => xs[i] + ',' + ay(v)).join(' ');
    s += '<polygon points="' + xs[0] + ',' + areaBot + ' ' + pts + ' ' + xs[n - 1] + ',' + areaBot + '" fill="rgba(56,189,248,.14)"/><polyline points="' + pts + '" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<circle cx="' + xs[n - 1] + '" cy="' + ay(D.area[n - 1]) + '" r="4" fill="#38bdf8" stroke="#141a20" stroke-width="2"/>';
    s += '<text x="' + (xs[n - 1] - 8) + '" y="' + (ay(D.area[n - 1]) - 10) + '" text-anchor="end" font-family="DM Mono" font-size="11.5" fill="#e8eef3">' + eur(D.area[n - 1]) + '</text>';
  } else {
    for(let k = 0; k <= 3; k++){ const v = Math.round(vmax / 4 * k); s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + vy(v) + '" y2="' + vy(v) + '" stroke="rgba(224,238,247,.07)"/><text x="' + (padL - 6) + '" y="' + (vy(v) + 4) + '" text-anchor="end" font-family="DM Mono" font-size="11" fill="#8392a0">' + v + '</text>'; }
  }
  D.vol.forEach((v, i) => { const bw = band * .6, y = vy(v); s += '<rect x="' + (xs[i] - bw / 2) + '" y="' + y + '" width="' + bw + '" height="' + Math.max(0, volBot - y) + '" rx="2" fill="rgba(125,211,252,' + (i === n - 1 ? '.7' : '.38') + ')"/>'; });
  s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + volBot + '" y2="' + volBot + '" stroke="rgba(224,238,247,.16)"/>';
  const every = (W < 460 && n > 6) ? 2 : 1;
  D.labels.forEach((l, i) => { if(i % every === (every === 2 ? (n - 1) % 2 : 0) || i === n - 1) s += '<text x="' + xs[i] + '" y="' + (Ht - 6) + '" text-anchor="middle" font-family="DM Mono" font-size="11" fill="#8392a0">' + l + '</text>'; });
  s += '<g class="cross" style="display:none"><line y1="' + padT + '" y2="' + volBot + '" stroke="rgba(224,238,247,.35)" stroke-dasharray="3 3"/>' + (showArea ? '<circle r="4.5" fill="#38bdf8" stroke="#141a20" stroke-width="2"/>' : '') + '</g>';
  s += '<rect class="hit" x="' + padL + '" y="0" width="' + (W - padL - padR) + '" height="' + Ht + '" fill="transparent" style="touch-action:pan-y"/></svg>';
  const tip = el.querySelector('.tip'); el.innerHTML = s; el.appendChild(tip);
  const cross = el.querySelector('.cross'), hit = el.querySelector('.hit');
  function at(ev){
    const r = el.getBoundingClientRect(); const px = (ev.clientX - r.left) * (W / r.width);

  S.dock.call = {id, t:0, lines:[], muted:false, keypad:false, opp:false, script:(id === 'osteo' ? LIVE_OSTEO : LIVE_GEN), idx:0, keys:''};
  if(parse()[0] === 'appels'){ go('#/appels/en-cours'); renderDock(true); } else renderDock(false);
  toast('Appel lancé vers ' + l.co, 'phone');
}
function endCall(vm){
  const c = S.dock.call; if(!c) return;
  S.dock.wrap = {id:c.id, dur:Math.max(c.t, vm ? 3 : 1), opp:c.opp, vm:!!vm, outcome:c.opp ? 'dnc' : vm ? 'repondeur' : 'rappel', note:c.id === 'osteo' ? 'Souhaite un rendez-vous à trois avec son associé, début de semaine prochaine.' : ''};
  S.dock.call = null;
  if(parse()[0] === 'appels'){ go('#/appels/resultat'); renderDock(true); } else renderDock(false);
}
setInterval(() => {
  const D = S.dock;
  if(D.call){
    const c = D.call; c.t++;
    if(c.id === 'vasseur' && c.t === 3){ endCall(true); toast('Répondeur détecté : appel raccroché', 'alert'); return; }
    if(!c.opp && c.t % 2 === 0 && c.idx < c.script.length){
      const s = c.script[c.idx++], line = [s[0], s[1], tfmt(c.t)]; c.lines.push(line);
      const lt = $('#livetr'); if(lt){ lt.insertAdjacentHTML('beforeend', liveLine(line)); lt.scrollTop = lt.scrollHeight; }
    }
    $$('[data-timer]').forEach(e => e.textContent = tfmt(c.t));
  }
  if(D.preview){ D.preview.left--; if(D.preview.left <= 0){ const id = D.preview.id; D.preview = null; startCall(id); } else $$('[data-count="preview"]').forEach(e => e.textContent = D.preview.left + ' s'); }
  if(D.powerNext){ D.powerNext.left--; if(D.powerNext.left <= 0){ const id = D.powerNext.id; D.powerNext = null; startCall(id); } else $$('[data-count="power"]').forEach(e => e.textContent = D.powerNext.left + ' s'); }
}, 1000);

  const lvl = {Scène:'acc', Configuration:'', Référentiel:''};
  return '<main class="scene"><div class="row sp" style="margin-bottom:12px"><a class="back" href="#/pipeline">' + ic('chevL', 'sm') + 'Retour au pipeline</a><button type="button" class="btn soft" data-act="ext-on">' + ic('user', 'sm') + 'Voir comme un commercial externe</button></div>' +
    '<h1 class="h-page">Plan du CRM</h1><p class="lede soft-t" style="margin:6px 0 14px">Neuf onglets à plat deviennent une scène unique, le pipeline, et un second niveau discret. Chaque fonction d’aujourd’hui a un seul endroit, listé ici.</p>' +
    '<div class="grid3" style="margin-bottom:14px"><div class="panel"><span class="tag acc">Scène</span><h3 style="margin:8px 0 4px">Pipeline</h3><p class="soft-t">Kanban ou tableau, bandeau de pilotage, filtre « À traiter », fiche en tiroir, dock d’appel. Tout le travail quotidien, sans changer d’écran.</p></div><div class="panel"><span class="tag">Configuration</span><h3 style="margin:8px 0 4px">Automatisations, séquences, réglages</h3><p class="soft-t">Ce qu’on change rarement. Un menu discret en haut à droite de la scène, jamais dans la barre de travail.</p></div><div class="panel"><span class="tag">Référentiel</span><h3 style="margin:8px 0 4px">Comptes clients, partenaires</h3><p class="soft-t">Les listes de référence qui existent en dehors d’un lead. Même second niveau.</p></div></div>' +
    '<div class="panel" style="padding:0"><div class="tablewrap" style="border:0"><table class="tbl" style="min-width:880px"><caption class="sr">Où se trouve chaque fonction d’aujourd’hui</caption><thead><tr><th scope="col">Fonction d’aujourd’hui</th><th scope="col">Où elle se trouve ici</th><th scope="col">Niveau</th><th scope="col"><span class="sr">Accès</span></th></tr></thead><tbody>' +
    R.map(r => '<tr><td>' + esc(r[0]) + '</td><td class="soft-t">' + esc(r[1]) + '</td><td><span class="tag ' + lvl[r[3]] + '">' + r[3] + '</span></td><td class="r">' + (r[2] === '#ext' ? '<button type="button" class="btn sm" data-act="ext-on">Voir l’aperçu</button>' : '<a class="btn sm" href="' + r[2] + '" aria-label="Aller à : ' + esc(r[1]) + '">Ouvrir</a>') + '</td></tr>').join('') + '</tbody></table></div></div></main>';
}

/* ============ interactions ============ */
function refreshScene(){
  const sc = $('#scene'); if(!sc) return;
  const r = parse(); sc.outerHTML = sceneHTML(r[0] === 'pilotage' ? (r[1] || 'previsions') : null, r[0] === 'pipeline' && r[1] === 'a-traiter'); drawCharts();
}
function closeMenus(){ $$('.menu').forEach(m => m.remove()); const b = $('#cfgbtn'); if(b) b.setAttribute('aria-expanded', 'false'); }
function openLead(id, tab){ if(tab) S.dTab = tab; else if(parse()[1] !== id) { S.dTab = 'appels'; S.aTab = 'analyse'; } go('#/lead/' + id); }
Object.assign(ACT, {
  toast: b => toast(b.dataset.msg),
  create: () => modal(MODALS.create()),
  'new-lead': () => modal(MODALS.newlead()),
  modal: b => { modal(MODALS[b.dataset.k]()); },
  'close-modal': b => { closeModal(); if(b.dataset.toast) toast(b.dataset.toast); },
  veil: (b, e) => { if(e.target === b) closeModal(); },
  'open-lead': b => openLead(b.dataset.id, b.dataset.tab),
  'open-lead-name': b => { const l = LEADS.find(x => x.co === b.dataset.n); if(l) openLead(l.id); },
  'close-lead': () => go(S.view === 'tableau' ? '#/pipeline/tableau' : '#/pipeline'),
  quick: b => { S.quick = b.dataset.k; S.keepScroll = true; if(parse()[1] === 'a-traiter') go(S.view === 'tableau' ? '#/pipeline/tableau' : '#/pipeline'); else { redrawFilters(); } },
  'reset-filters': () => { S.quick = 'tous'; S.q = ''; const i = $('.searchbox input'); if(i) i.value = ''; redrawFilters(); },
  cfgmenu: b => {
    const ex = $('.menu'); if(ex){ closeMenus(); return; }
    b.setAttribute('aria-expanded', 'true');
    b.parentNode.insertAdjacentHTML('beforeend', '<div class="menu" role="menu"><div class="mgrp">Configuration</div><a role="menuitem" href="#/config/automatisations/regles">' + ic('bolt', 'sm') + 'Automatisations</a><a role="menuitem" href="#/config/automatisations/sequences">' + ic('mail', 'sm') + 'Séquences d’e-mails</a><a role="menuitem" href="#/config/reglages/statuts">' + ic('sliders', 'sm') + 'Réglages</a><div class="mgrp">Référentiels</div><a role="menuitem" href="#/ref/comptes">' + ic('users', 'sm') + 'Comptes clients</a><a role="menuitem" href="#/ref/partenaires">' + ic('link', 'sm') + 'Partenaires</a><div class="sepm"></div><a role="menuitem" href="#/plan">' + ic('list', 'sm') + 'Plan du CRM</a></div>');
  },
  range: b => { S.range = b.dataset.k; S.keepScroll = true; refreshScene(); },
  week: b => { S.week = +b.dataset.k; S.keepScroll = true; refreshScene(); },
  goal: () => modal(MODALS.goal()),
  sel: b => { b.checked ? S.sel.add(b.dataset.id) : S.sel.delete(b.dataset.id); redrawBoard(); },
  'sel-all': b => { S.sel = b.checked ? new Set(visible().map(l => l.id)) : new Set(); redrawBoard(); },
  'bulk-clear': () => { S.sel.clear(); redrawBoard(); },
  bulk: b => { closeModal(); const n = S.sel.size, k = b.dataset.k; toast(({assign:'Assignation proposée pour ', status:'Changement de statut proposé pour ', export:'Export CSV prêt : ', archive:'Maquette : archivage simulé pour '})[k] + n + ' fiche' + (n > 1 ? 's' : '')); if(k === 'archive' || k === 'export') { S.sel.clear(); redrawBoard(); } },
  'bulk-del': () => modal(MODALS['bulk-del']()),
  'set-stage': b => { moveLead(b.dataset.id, b.dataset.k); toast('Statut : ' + stageOf(b.dataset.k).label + '. Les compteurs du pipeline sont recalculés.'); S.keepScroll = true; refreshScene(); redrawDrawer(); },
  dtab: b => { S.dTab = b.dataset.k; redrawDrawer(); },
  atab: b => { S.aTab = b.dataset.k; if(b.dataset.k === 'analyse') S.hit = null; redrawDrawer(); },
  'show-quote': b => { S.aTab = 'conv'; S.hit = b.dataset.ts; S.transQ = ''; redrawDrawer(); const t = $('#tl-' + b.dataset.ts.replace(':', '')); if(t) t.scrollIntoView({block:'center'}); },
  dec: b => {
    const k = b.dataset.k, v = b.dataset.v;
    if(v === 'EDIT'){ S.editing = S.editing === k ? null : k; }
    else { S.analysis[k] = S.analysis[k] === v ? 'none' : v; S.editing = null; if(k === 'heat' && v !== 'EDIT') delete S.edits.heat; }
    redrawDrawer();
  },
  'edit-ok': b => { const k = b.dataset.k, i = $('#ed-' + k); S.edits[k] = i.value.trim() || AF.find(f => f.k === k).val; S.analysis[k] = 'EDIT'; S.editing = null; redrawDrawer(); },
  'edit-no': () => { S.editing = null; redrawDrawer(); },
  apply: () => {
    const c = counts(); S.analysisApplied = true; S.validated.add('dubreuil'); lead('dubreuil').tags = [];
    if(S.analysis.heat === 'EDIT' && S.edits.heat) lead('dubreuil').heat = S.edits.heat;
    toast('Analyse validée : ' + c.a + ' décision' + (c.a > 1 ? 's' : '') + ' appliquée' + (c.a > 1 ? 's' : '') + ' à la fiche', 'check'); S.keepScroll = true; refreshScene(); redrawDrawer();
  },
  reject: () => { closeModal(); S.analysisRejected = true; S.validated.add('dubreuil'); lead('dubreuil').tags = []; S.keepScroll = true; refreshScene(); redrawDrawer(); toast('Analyse rejetée : rien n’a été écrit sur la fiche'); },
  'reopen-analysis': () => { S.analysisRejected = false; S.validated.delete('dubreuil'); lead('dubreuil').tags = [['acc', 'Analyse à valider']]; S.keepScroll = true; refreshScene(); redrawDrawer(); },
  'validate-other': b => { S.validated.add(b.dataset.id); lead(b.dataset.id).tags = lead(b.dataset.id).tags.filter(t => t[1] !== 'Analyse à valider'); S.keepScroll = true; refreshScene(); redrawDrawer(); toast('Analyse validée'); },
  hold: b => { S.hold = b.dataset.k; S.validated.add('pilates'); closeModal(); const l = lead('pilates'); l.tags = b.dataset.k === 'confirmed' ? [['crit', 'Ne pas rappeler']] : []; l.next = b.dataset.k === 'confirmed' ? 'Ne pas rappeler' : 'Rappeler'; S.keepScroll = true; refreshScene(); redrawDrawer(); toast(b.dataset.k === 'confirmed' ? 'Opposition confirmée : numéro ajouté aux numéros opposés' : 'Retenue levée', 'shield'); },
  'wl-done': b => { S.done.add(b.dataset.k); redrawBoard(); toast('Contact consigné sur la fiche'); },
  'wl-note': b => { S.noteOpen = S.noteOpen === b.dataset.k ? null : b.dataset.k; redrawBoard(); const i = $('.wl-note.open input'); if(i) i.focus(); },
  'wl-note-save': b => { S.noteOpen = null; redrawBoard(); toast('Note ajoutée à la fiche'); },
  sim: b => { const r = RULES.find(x => x.id === b.dataset.k); modal('<h2 id="mt">Simulation : ' + r.n + '</h2><p class="soft-t" style="margin-top:6px">Rien n’est exécuté. Avec les données d’aujourd’hui, la règle se déclencherait sur :</p><ul style="margin:10px 0 0;padding-left:18px">' + SIM[r.id].map(x => '<li>' + x + '</li>').join('') + '</ul><div class="acts"><button type="button" class="btn primary" data-act="close-modal">Fermer</button></div>'); },
  'ext-on': () => { S.ext = true; S.dock.sel = 'durand'; S.quick = 'tous'; S.q = ''; go('#/pipeline'); render(); },
  'ext-off': () => { S.ext = false; S.dock.sel = 'osteo'; render(); },
  /* poste d'appel */
  'call-lead': b => { const id = b.dataset.id; S.dock.sel = id; startCall(id); },
  'call-quick': () => callSel(),
  'call-now': () => callSel(true),
  'preview-cancel': () => { S.dock.preview = null; S.dock.powerNext = null; renderDock(parse()[0] === 'appels'); },
  scope: b => { S.dock.scope = b.dataset.k; renderDock(true); },
  mode: b => { S.dock.mode = b.dataset.k; S.dock.preview = null; renderDock(parse()[0] === 'appels'); },
  qsel: b => {
    S.dock.sel = b.dataset.id; S.dock.preview = null;
    const l = lead(b.dataset.id);
    if(S.dock.mode === 'preview' && !blockedReason(l)) S.dock.preview = {id:l.id, left:8};
    renderDock(true);
  },
  mute: () => { S.dock.call.muted = !S.dock.call.muted; renderDock(parse()[0] === 'appels'); },
  keypad: () => { S.dock.call.keypad = !S.dock.call.keypad; renderDock(parse()[0] === 'appels'); },
  key: b => { const c = S.dock.call; c.keys = (c.keys || '') + b.dataset.k; const e = $('#keys'); if(e) e.textContent = 'Touches envoyées : ' + c.keys; },
  'opp-ok': () => { const c = S.dock.call; closeModal(); if(!c) return; c.opp = true; c.lines.push(['sys', 'Le prospect s’oppose à l’enregistrement : enregistrement et transcription arrêtés, analyse retenue jusqu’à votre décision.']); renderDock(parse()[0] === 'appels'); toast('Opposition signalée : enregistrement arrêté', 'shield'); },
  hangup: () => endCall(false)
});
function callSel(force){
  const id = S.dock.sel, l = lead(id);
  if(!force && S.dock.mode === 'preview' && !blockedReason(l)){ S.dock.preview = {id, left:8}; renderDock(parse()[0] === 'appels'); return; }
  startCall(id);
}
function redrawFilters(){ S.keepScroll = true; refreshScene(); const i = $('.searchbox input'); if(i) i.value = S.q; }

document.addEventListener('click', e => {
  const m = e.target.closest('.menu, #cfgbtn'); if(!m) closeMenus();
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.tagName === 'INPUT' && b.type === 'checkbox'){ ACT[b.dataset.act] && ACT[b.dataset.act](b, e); return; }
  const f = ACT[b.dataset.act]; if(f){ if(b.tagName === 'A' && b.getAttribute('href') === '#') e.preventDefault(); f(b, e); }
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.actInput;
  if(k === 'q'){ S.q = t.value; redrawBoard(); }
  else if(k === 'tq'){ S.transQ = t.value; const p = t.selectionStart; redrawDrawer(); const i = $('#tq'); if(i){ i.focus(); i.setSelectionRange(p, p); } }
  else if(k === 'mq'){ const q = t.value.trim().toLowerCase(), cur = parse()[1], r = $('#mres'); r.innerHTML = q ? LEADS.filter(l => l.id !== cur && (l.co + l.ct).toLowerCase().includes(q)).map(l => '<button type="button" class="btn" style="justify-content:flex-start" data-act="close-modal" data-toast="Maquette : les fiches ne sont pas fusionnées">' + esc(l.co) + ' <span class="muted">· ' + esc(l.ct) + '</span></button>').join('') || '<p class="muted">Aucune fiche trouvée.</p>' : ''; }
  else if(t.id === 'wnote' && S.dock.wrap) S.dock.wrap.note = t.value;
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.chg; if(!k) return;
  if(k === 'stage'){ moveLead(t.dataset.id, t.value); toast('Statut modifié : ' + stageOf(t.value).label + '. Compteurs recalculés.'); S.keepScroll = true; refreshScene(); }
  else if(k === 'postpone'){ if(t.value){ S.postponed[t.dataset.k] = t.value; redrawBoard(); toast('Relance reportée : ' + t.value.toLowerCase()); } }
  else if(k === 'heat'){ if(t.value){ S.analysis.heat = 'EDIT'; S.edits.heat = t.value; redrawDrawer(); } }
  else if(k === 'outcome' && S.dock.wrap) S.dock.wrap.outcome = t.value;
  else if(k === 'mic') toast('Micro changé : ' + t.value.replace('Micro : ', ''));
  else if(k === 'rule'){ S.rules[t.dataset.k] = t.checked; toast(t.checked ? 'Règle activée' : 'Règle mise en pause'); configRefresh(); }
  else if(k === 'seq'){ S.seq[t.dataset.k] = t.checked; toast(t.checked ? 'Séquence activée' : 'Séquence mise en pause'); configRefresh(); }
  else if(k === 'prob'){ const s = stageOf(t.dataset.k), v = Math.max(0, Math.min(100, parseInt(t.value, 10) || 0)); s.p = v; t.value = v; recalc(); const e2 = $('#savedat'); if(e2) e2.textContent = 'Enregistré : le montant pondéré est recalculé'; toast('Probabilité enregistrée : pondéré ' + eur(TOT.w)); }
  else if(k === 'set'){ const e2 = $('#savedat'); if(e2) e2.textContent = 'Enregistré à l’instant'; toast('Réglage enregistré'); }
});
function configRefresh(){ const y = window.scrollY; S.keepScroll = true; const r = parse(); $('#page').innerHTML = configPage(r[1], r[2]); window.scrollTo(0, y); }
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-act-submit]'); if(!f) return; e.preventDefault();
  const k = f.dataset.actSubmit;
  if(k === 'close-modal'){ closeModal(); if(f.dataset.toast) toast(f.dataset.toast); }
  else if(k === 'goal'){ const v = parseInt($('#gv').value.replace(/\D/g, ''), 10); if(v > 0){ S.goal = v; closeModal(); S.keepScroll = true; refreshScene(); toast('Objectif enregistré : ' + eur(v)); } }
  else if(k === 'result'){
    const w = S.dock.wrap, l = lead(w.id), o = OUTCOMES.find(x => x[0] === w.outcome);
    if(w.outcome === 'repondeur') S.marks[w.id] = 'repondeur';
    const idx = QORDER.indexOf(w.id), next = QORDER[(idx + 1) % QORDER.length];
    S.dock.wrap = null; S.dock.sel = next;
    if(S.dock.mode === 'power' && !blockedReason(lead(next))) S.dock.powerNext = {id:next, left:5};
    toast('Résultat enregistré : ' + o[1] + (w.opp ? '. Analyse retenue jusqu’à décision' : ''), 'check');
    go('#/appels');
    renderDock(true);
  }
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('#overlay').firstChild){ closeModal(); return; }
  if($('.menu')){ closeMenus(); return; }
  if(parse()[0] === 'lead') ACT['close-lead']();
});
window.addEventListener('hashchange', () => render());

/* ============ démarrage ============ */
$('#root').innerHTML = shellHTML();
(function(){
  /* états d'appel pilotés par l'URL */
  const orig = render;
  render = function(){
    const r = parse();
    if(r[0] === 'appels'){
      if(r[1] === 'en-cours' && !S.dock.call){ if(S.dock.wrap) { go('#/appels/resultat'); return; } const id = S.dock.sel, why = blockedReason(lead(id)); if(why){ S.dock.sel = 'osteo'; } S.dock.preview = null; S.dock.call = {id:S.dock.sel, t:0, lines:[], muted:false, keypad:false, opp:false, script:(S.dock.sel === 'osteo' ? LIVE_OSTEO : LIVE_GEN), idx:0, keys:''}; }
      if(r[1] === 'resultat' && !S.dock.wrap && !S.dock.call){ S.dock.wrap = {id:S.dock.sel, dur:243, opp:false, vm:false, outcome:'rappel', note:S.dock.sel === 'osteo' ? 'Souhaite un rendez-vous à trois avec son associé, début de semaine prochaine.' : ''}; }
    }
    return orig();
  };
  render();
})();
</script>
</body>
