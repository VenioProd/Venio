<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM par objets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#0a0c0f;--card:#141a20;--card-hover:#1b242c;--raised:#202a33;--panel:#0d1115;
  --border:rgba(224,238,247,.09);--border-soft:rgba(224,238,247,.07);--line:rgba(224,238,247,.16);
  --tx:#e8eef3;--tx2:#9daab3;--mut:#7b8894;
  --pri-rgb:56,189,248;--pri:rgb(var(--pri-rgb));--pri-l:rgb(125,211,252);--pri-d:#0ea5e9;--pri-fg:#06202b;
  --accent-surface:rgba(var(--pri-rgb),.09);--accent-med:rgba(var(--pri-rgb),.14);--accent-border:rgba(var(--pri-rgb),.34);--ring:rgba(var(--pri-rgb),.55);
  --crit:#ff8a8a;--serious:#f4a06a;--warn:#f7c268;--good:#7fdba0;
  --r-sm:6px;--r-md:10px;--r-lg:13px;--r-pill:999px;
  --sans:'Manrope','Cabinet Grotesk',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;
  --rail:50px;--snav:248px;--top:48px;--dock:clamp(520px,42vw,600px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:500 12.5px/1.5 var(--sans);overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri-l);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-sm)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:400}
.mut{color:var(--mut)}.tx2{color:var(--tx2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* coque */
.app{display:grid;grid-template-columns:var(--rail) var(--snav) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr);height:100vh;height:100dvh}
.rail{grid-row:1/3;grid-column:1;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.rail a,.rail button{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--tx2);background:none;border:0}
.rail a:hover{background:var(--card);text-decoration:none}
.rail a[aria-current=page]{background:var(--accent-med);color:var(--pri-l)}
.rail .logo{width:30px;height:30px;border-radius:var(--r-md);background:var(--pri);color:var(--pri-fg);font-weight:800;font-size:15px;display:grid;place-items:center;margin-bottom:8px}
.rail .grow{flex:1}
.top{grid-row:1;grid-column:2/4;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--bg);min-width:0}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--mut);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs a{color:var(--tx2)}.crumbs b{color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumbs svg{width:12px;height:12px}
.top .sp{flex:1}
.cmd{display:flex;align-items:center;gap:8px;width:300px;max-width:100%;height:32px;padding:0 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--mut)}
.cmd kbd,.kbd{font:400 11px var(--mono);background:var(--card-hover);color:var(--tx2);border-radius:var(--r-sm);padding:1px 6px;margin-left:auto}
.ib{width:32px;height:32px;display:grid;place-items:center;background:none;border:0;border-radius:var(--r-md);color:var(--tx2);position:relative}
.ib:hover{background:var(--card)}
.ib .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--pri)}
.lang{display:flex;background:var(--card);border-radius:var(--r-md);padding:2px}
.lang button{border:0;background:none;color:var(--tx2);padding:3px 8px;border-radius:var(--r-sm);font-weight:700;font-size:11.5px}
.lang button[aria-pressed=true]{background:var(--card-hover);color:var(--tx)}
.who{display:flex;align-items:center;gap:8px;background:none;border:0;padding:3px 6px;border-radius:var(--r-md);color:var(--tx)}
.who:hover{background:var(--card)}
.menu-btn{display:none}

/* navigation secondaire par objets */
.snav{grid-row:2;grid-column:2;background:var(--bg);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;padding:12px 10px 10px}
.snav-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px}
.snav-head h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
.snav-find{display:flex;align-items:center;gap:8px;height:32px;margin:0 2px 8px;padding:0 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--mut)}
.snav-find input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx)}
.snav-find:focus-within{box-shadow:0 0 0 2px var(--ring)}
.ng{margin-top:10px}
.ng-title{padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--mut)}
.obj{width:100%;display:flex;align-items:center;gap:9px;padding:7px 10px;border:0;background:none;color:var(--tx);border-radius:var(--r-md);font-weight:700;text-align:left;position:relative}
.obj:hover{background:var(--card)}
.obj .chev{margin-left:auto;transition:transform .15s;color:var(--mut)}
.obj[aria-expanded=true] .chev{transform:rotate(90deg)}
.obj .n{margin-left:auto;font:400 11.5px var(--mono);color:var(--mut)}
.obj.on{color:var(--pri-l)}
.views{list-style:none;margin:1px 0 6px;padding:0 0 0 18px;display:flex;flex-direction:column;gap:1px}
.views[hidden]{display:none}
.view{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--r-md);color:var(--tx2);font-weight:500;position:relative;text-decoration:none!important}
.view:hover{background:var(--card);color:var(--tx)}
.view .n{margin-left:auto;font:400 11.5px var(--mono);color:var(--mut)}
.view .dot{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--mut);flex:none}
.view[aria-current=page]{background:var(--accent-surface);color:var(--tx);font-weight:700}
.view[aria-current=page] .dot{background:var(--pri);border-color:var(--pri)}
.view[aria-current=page]::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--pri)}
.snav-bottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.snav-foot{padding:10px 10px 2px;color:var(--mut);font-size:11.5px}

/* zone de contenu */
.main{grid-row:2;grid-column:3;min-width:0;overflow:auto;position:relative}
.main.split{display:flex;overflow:hidden}
.main.split .list-side{flex:1;min-width:0;overflow:auto;padding:20px 22px 40px}
.dock{flex:none;width:var(--dock);max-width:62%;overflow:auto;background:var(--panel);border-left:1px solid var(--border)}
.page{padding:20px 24px 48px;max-width:1280px}
.page.wide{max-width:none}

/* en-tête de vue */
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.vh h1{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.vh .sub{color:var(--tx2);margin-top:4px;max-width:70ch}
.vh .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vtag{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:11.5px;font-weight:600;margin-bottom:6px}
.vtag svg{width:13px;height:13px}
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tb .sp{flex:1}
.field{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--mut)}
.field input{background:none;border:0;outline:0;color:var(--tx);min-width:0;width:170px}
.field:focus-within{box-shadow:0 0 0 2px var(--ring)}

/* boutons et gélules */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;border-radius:var(--r-md);font-weight:700;font-size:12px;border:1px solid transparent;background:var(--pri);color:var(--pri-fg);white-space:nowrap;text-decoration:none!important}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:transparent;border-color:var(--line);color:var(--tx)}
.btn.sec:hover{background:var(--card)}
.btn.soft{background:var(--accent-med);border-color:var(--accent-border);color:var(--pri-l)}
.btn.soft:hover{background:rgba(var(--pri-rgb),.2)}
.btn.danger{background:rgba(255,138,138,.10);border-color:rgba(255,138,138,.32);color:var(--crit)}
.btn.danger:hover{background:rgba(255,138,138,.16)}
.btn.ghost{background:none;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{background:var(--card);color:var(--tx)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:var(--r-sm)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.icon{padding:7px;width:32px;height:32px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--r-pill);border:1px solid var(--line);background:none;color:var(--tx2);font-weight:600;font-size:12px;white-space:nowrap}
.pill:hover{background:var(--card);color:var(--tx)}
.pill[aria-pressed=true],.pill.on{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}
.pill.add{border-style:dashed;color:var(--mut)}
.pill .n{font:400 11.5px var(--mono);opacity:.85}
.seg{display:inline-flex;background:var(--card);border-radius:var(--r-md);padding:3px;gap:2px}
.seg button,.seg a{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-sm);border:0;background:none;color:var(--tx2);font-weight:700;font-size:12px;text-decoration:none!important}
.seg [aria-pressed=true],.seg [aria-current=page]{background:var(--card-hover);color:var(--pri-l)}
.seg button:hover,.seg a:hover{color:var(--tx)}

/* tableau */
.tw{border:1px solid var(--border-soft);border-radius:var(--r-lg);background:var(--card);overflow:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%;min-width:640px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--mut);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--card-hover)}
.tbl tbody tr.sel td{background:var(--accent-surface)}
.tbl tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--pri)}
.tbl td.num,.tbl th.num{text-align:right}
.tbl .name{font-weight:700;color:var(--tx)}
.tbl .name small{display:block;color:var(--mut);font-weight:500;font-size:11.5px}
.tbl tr.grp td{background:var(--bg);cursor:default;padding:8px 12px;font-weight:600;color:var(--tx);border-bottom:1px solid var(--border)}
.tbl tr.grp:hover td{background:var(--bg)}
.tbl td.chk,.tbl th.chk{width:34px;padding-right:0}
input[type=checkbox]{accent-color:#38bdf8;width:15px;height:15px}
.tfoot{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 12px;color:var(--tx2);border-top:1px solid var(--border);flex-wrap:wrap}
.sumbar{display:flex;gap:18px;flex-wrap:wrap}
.sumbar b{font-family:var(--mono);font-weight:500;color:var(--tx)}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px;background:var(--accent-surface);border:1px solid var(--accent-border);border-radius:var(--r-lg)}
.bulk[hidden]{display:none}

/* puces */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--c,#9daab3) 15%,var(--bg));color:var(--c,#9daab3);white-space:nowrap}
.chip svg{width:12px;height:12px}
.c-pri{--c:#7dd3fc}.c-good{--c:#7fdba0}.c-warn{--c:#f7c268}.c-crit{--c:#ff8a8a}.c-serious{--c:#f4a06a}.c-mut{--c:#9daab3}
.sdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c);display:inline-block;flex:none}
.sdot.full{background:var(--c)}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.av{width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--pri-fg);display:inline-grid;place-items:center;font-weight:800;font-size:10.5px;flex:none}
.av.n{background:var(--raised);color:var(--tx)}
.av.lg{width:34px;height:34px;font-size:13px}
.own{display:inline-flex;align-items:center;gap:7px}
.redmark{display:inline-flex;align-items:center;gap:5px;color:var(--crit);font-weight:600}
.redmark i{width:8px;height:8px;border-radius:50%;background:var(--crit);display:inline-block}

/* cartes */
.card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg);padding:16px}
.card h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.card .hint{color:var(--tx2);margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--mut);font-weight:600;font-size:11.5px}
.kpi .d{color:var(--tx2);font-size:12px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--c) 7%,var(--bg));border:1px solid color-mix(in srgb,var(--c) 26%,transparent);color:var(--tx);margin-bottom:12px}
.banner svg{color:var(--c);margin-top:1px}
.banner b{color:var(--c)}
.banner .grow{flex:1;min-width:0}
.banner .rowbtn{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:42px 20px;color:var(--tx2)}
.empty svg{width:28px;height:28px;color:var(--mut)}
.empty h3{font-size:17px;font-weight:800;color:var(--tx)}
.empty p{max-width:46ch}
.pairs{display:grid;grid-template-columns:130px minmax(0,1fr);gap:0}
.pairs dt,.pairs dd{margin:0;padding:8px 0;border-bottom:1px solid var(--border-soft)}
.pairs dt{color:var(--mut);font-weight:600;font-size:11.5px;padding-top:9px}
.pairs dd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
select.sel,input.inp,textarea.inp{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:6px 10px;color:var(--tx);min-height:32px;max-width:100%}
textarea.inp{width:100%;min-height:76px;resize:vertical}
input.inp{width:100%}
select.sel:focus,input.inp:focus,textarea.inp:focus{outline:0;box-shadow:0 0 0 2px var(--ring)}
label.lab{display:block;color:var(--mut);font-weight:600;font-size:11.5px;margin-bottom:5px}
.frm{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:16px;scrollbar-width:thin}
.tabs button,.tabs a{position:relative;display:inline-flex;align-items:center;gap:7px;padding:10px 10px;color:var(--tx2);background:none;border:0;font-weight:600;white-space:nowrap;border-radius:var(--r-sm);text-decoration:none!important}
.tabs [aria-selected=true]{color:var(--tx)}
.tabs [aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--pri);border-radius:2px}
.tabs .n{font:400 11.5px var(--mono);color:var(--mut)}

/* fiche lead */
.fiche{padding:18px 22px 40px}
.fh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.fh h2{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.fh .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--tx2)}
.fh .meta .mono{color:var(--tx2)}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.dock .fgrid{grid-template-columns:minmax(0,1fr)}
.section{margin-bottom:22px}
.section>h3{font-size:15px;font-weight:800;letter-spacing:-.015em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section>h3 .n{font:400 11.5px var(--mono);color:var(--mut)}
.todo{display:flex;flex-direction:column;gap:8px}
.todo .it{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border-soft);background:var(--card);border-radius:var(--r-lg)}
.todo .it .tt{flex:1;min-width:0}
.todo .it .tt b{display:block}
.todo .it .tt span{color:var(--tx2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.tl time{font:400 11.5px var(--mono);color:var(--mut);padding-top:2px}
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.steps .s{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.steps .s:last-child{border-bottom:0}

/* appel analysé */
.callhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg);margin-bottom:12px}
.callhead .grow{flex:1;min-width:0}
.player{display:flex;align-items:center;gap:10px;margin-top:10px}
.wave{flex:1;height:26px;display:flex;align-items:center;gap:2px}
.wave i{display:block;width:3px;background:var(--raised);border-radius:2px}
.wave i.p{background:var(--pri)}
.sum{padding:12px 14px;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg);color:var(--tx);font-size:13px;line-height:1.6}
.tr{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding:12px 14px;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg)}
.tr .ln{display:grid;grid-template-columns:44px 74px 1fr;gap:8px;padding:2px 0;align-items:baseline}
.tr .ln.hl{background:var(--accent-surface);border-radius:var(--r-sm);margin:0 -6px;padding:3px 6px}
.tr .t{font:400 11.5px var(--mono);color:var(--mut)}
.tr .sp-a{color:var(--pri-l);font-weight:700}
.tr .sp-b{color:var(--tx);font-weight:700}
.prop{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--border-soft)}
.prop:last-child{border-bottom:0}
.prop .lbl{color:var(--mut);font-weight:600;font-size:11.5px}
.prop .val{font-weight:700;font-size:13px}
.prop .cite{grid-column:1/-1;color:var(--tx2);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prop .acts{display:flex;gap:6px;align-items:center}
.prop[data-state=ok] .val{color:var(--good)}
.prop[data-state=skip] .val{color:var(--mut);text-decoration:line-through}
.plist{border:1px solid var(--border-soft);background:var(--card);border-radius:var(--r-lg)}
.heat{display:flex;flex-direction:column;gap:9px;padding:14px;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg)}
.heat .row{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center}
.bar{height:7px;border-radius:7px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:7px}
.bar.bad i{background:var(--serious)}
.foot-save{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;margin-top:12px;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg)}

/* kanban */

.kcol.over{background:var(--accent-surface)}

.kcol header .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px}
.kcol header .t .n{font:400 11.5px var(--mono);color:var(--mut);margin-left:auto}
.kcol header .s{font:400 11.5px var(--mono);color:var(--tx2);margin-top:3px}
.kcol .cards{display:flex;flex-direction:column;gap:8px;padding:4px 8px 10px;flex:1}
.kcard{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg);padding:11px 12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left}
.kcard:hover{background:var(--card-hover)}
.kcard.sel{border-color:var(--accent-border);background:var(--accent-surface)}
.kcard .n1{font-weight:700;color:var(--tx)}
.kcard .r{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--tx2)}
.kcard[draggable=true]{cursor:grab}
.kmore{padding:6px 12px 12px;color:var(--mut);font-size:11.5px}

.deskbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.modehelp{padding:10px 14px;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg);color:var(--tx2);margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.modehelp b{color:var(--tx)}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer}
.qrow:hover{background:var(--card-hover)}
.qrow.sel{background:var(--accent-surface);box-shadow:inset 3px 0 0 var(--pri)}

.qgrp .n{font:400 11.5px var(--mono);color:var(--mut)}
.qrow .nm{font-weight:700;min-width:0}
.qrow .nm small{display:block;color:var(--mut);font-weight:500;font-size:11.5px}
.qrow .lt{font:400 11.5px var(--mono);color:var(--tx2);text-align:right}
.callbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;background:var(--card);border:1px solid var(--accent-border);border-radius:var(--r-lg);margin-bottom:12px}

.callbar .grow{flex:1;min-width:0}
.callbar .ctl{display:flex;gap:8px;flex-wrap:wrap}

.live .ln.now{color:var(--tx2)}

.result label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border-soft);background:var(--card);border-radius:var(--r-md);cursor:pointer}
.result label:has(input:checked){border-color:var(--accent-border);background:var(--accent-surface)}
.result label b{display:block}
.result label span{color:var(--tx2)}
input[type=radio]{accent-color:#38bdf8;margin-top:3px}

.cwrap{overflow-x:auto;max-width:100%}
.chart{width:100%;min-width:620px;height:auto;display:block}

.chart .grid line{stroke:rgba(224,238,247,.07)}
.chart .area{fill:rgba(56,189,248,.14)}
.chart .stroke{fill:none;stroke:#38bdf8;stroke-width:1.8;stroke-linejoin:round}
.chart .vol{fill:rgba(56,189,248,.35)}
.chart .vol.hi{fill:#38bdf8}
.chart .cross line{stroke:rgba(224,238,247,.35);stroke-dasharray:3 3}
.chart .tip rect{fill:#202a33;stroke:rgba(224,238,247,.16)}
.chart .tip text{fill:#e8eef3}
.chart .ref{stroke:#f7c268;stroke-dasharray:4 4;stroke-width:1.2}
.chart .reflab{fill:#f7c268}
.range{display:inline-flex;gap:2px;background:var(--card);border-radius:var(--r-md);padding:3px}
.range button{border:0;background:none;color:var(--tx2);padding:4px 10px;border-radius:var(--r-sm);font:500 11.5px var(--mono)}
.range button[aria-pressed=true]{background:var(--card-hover);color:var(--pri-l)}
.hbar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 40px;gap:12px;align-items:center;padding:7px 0}

.setgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.setgrid>*{min-width:0}
.setnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.setnav .gt{padding:10px 10px 4px;color:var(--mut);font-weight:600;font-size:11.5px}
.setnav a{padding:6px 10px;border-radius:var(--r-md);color:var(--tx2);font-weight:600;text-decoration:none!important;position:relative}
.setnav a:hover{background:var(--card);color:var(--tx)}
.setnav a[aria-current=page]{background:var(--accent-surface);color:var(--tx)}
.setnav a[aria-current=page]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--pri)}
.sset{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border-soft)}
.srow:last-child{border-bottom:0}
.srow b{display:block}
.srow span.d{color:var(--tx2)}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;background:var(--raised);border-radius:22px;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--tx2);transition:transform .15s}
.sw input:checked+i{background:var(--pri)}
.sw input:checked+i::after{transform:translateX(16px);background:var(--pri-fg)}

.days{display:flex;gap:6px;flex-wrap:wrap}
.num-in{width:84px;text-align:right;font-family:var(--mono)}

.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

.objcard svg{width:20px;height:20px;color:var(--pri-l);margin-top:2px}
.objcard b{display:block}
.objcard span{color:var(--tx2)}
.stack{display:flex;height:10px;border-radius:10px;overflow:hidden;gap:2px}
.stack i{display:block;background:var(--pri);opacity:.9}
.mini-h{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:22px 0 10px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.perm{background:var(--accent-surface);border:1px dashed var(--accent-border);border-radius:var(--r-lg);padding:10px 14px;color:var(--tx2);margin-bottom:12px}

.plan td:first-child{font-weight:700}
.plan td{white-space:normal;vertical-align:top}
.plan tbody tr{cursor:default}

/* adaptatif */
@media (max-width:1100px){
  :root{--snav:216px}
  .main.split{display:block;overflow:auto}
  .main.split .list-side{overflow:visible;padding:16px 16px 40px}
  .dock{position:fixed;top:var(--top);right:0;bottom:0;left:calc(var(--rail) + var(--snav));width:auto;max-width:none;z-index:30}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .callgrid,.fgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{display:block;height:auto;min-height:100vh}
  .rail{display:none}
  .top{position:sticky;top:0;z-index:40;padding:0 12px;height:var(--top)}
  .menu-btn{display:grid}
  .snav{display:none;position:fixed;top:var(--top);left:0;right:0;bottom:0;z-index:35;border:0;padding:12px 14px 24px}
  body[data-nav=open] .snav{display:flex}
  body[data-nav=open]{overflow:hidden}
  .main{overflow:visible;min-height:calc(100vh - var(--top))}
  .main.split{display:block}
  .dock{left:0;top:var(--top)}
  .cmd,.who span.nm,.lang,.top .hide-sm{display:none}
  .page{padding:16px 14px 40px}
  .vh h1{font-size:22px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .setgrid{grid-template-columns:minmax(0,1fr)}
  .setnav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  .setnav .gt{display:none}
  .setnav a{white-space:nowrap}
  .pairs{grid-template-columns:100px minmax(0,1fr)}
  .row2{grid-template-columns:minmax(0,1fr)}
  .kb{grid-template-columns:repeat(5,250px)}
  .qrow{grid-template-columns:auto minmax(0,1fr) auto}
  .qrow .lt{display:none}
  .tl li{grid-template-columns:1fr}
  .hbar{grid-template-columns:minmax(0,1fr) 40px}.hbar .bar{grid-column:1/3;grid-row:2}
  .heat .row{grid-template-columns:100px 1fr 48px}
  .tr .ln,.live .ln{grid-template-columns:40px 1fr}
  .tr .ln>:nth-child(3),.live .ln>:nth-child(3){grid-column:1/3}
  .fiche{padding:16px 14px 40px}
}
@media (pointer:coarse),(max-width:900px){
  .pill,.btn:not(.sm){min-height:40px}.btn.sm{min-height:36px}
  .ib{width:40px;height:40px}
  .view,.obj{min-height:40px}
  .seg button,.seg a{min-height:36px}
  .tbl td,.tbl th{padding-top:11px;padding-bottom:11px}
  input[type=checkbox]{width:20px;height:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Kanban */
const renderKanban = (view, openId) => {
  const rows = applyFil(VIEW_ROWS(view));
  const cols = ORDER.map(s => {
    const items = rows.filter(l => l.status === s);
    const named = L.filter(l => l.status === s).length;
    const more = view === 'tous' ? stageN(s) - named : 0;
    return `<section class="kcol" data-drop="${s}" aria-label="${STATUS[s].label}"><header><div class="t"><span class="sdot full" style="--c:${STATUS[s].c}"></span>${STATUS[s].label}<span class="n">${view === 'tous' ? stageN(s) : items.length}</span></div><div class="s">${view === 'tous' ? eur(stageSum(s)) : eur(items.reduce((a, l) => a + l.budget, 0))}</div></header>
      <div class="cards">${items.map(l => `<div class="kcard ${openId === l.id ? 'sel' : ''}" draggable="true" data-drag="${l.id}" data-open="${l.id}" tabindex="0" role="button" aria-label="Ouvrir ${esc(l.name)}">

        <span class="r">${heatChip(l.heat)}<span class="av ${l.owner.includes('Externe') ? 'n' : ''}" title="${esc(l.owner)}" aria-label="Assigné à ${esc(l.owner)}">${initials(l.owner)}</span></span>
        <span class="tx2">${esc(l.next)}</span></div>`).join('') || '<div class="kmore">Aucune fiche.</div>'}</div>
      ${more > 0 ? `<div class="kmore">et ${more} autre${more > 1 ? 's' : ''} lead${more > 1 ? 's' : ''} dans cette colonne</div>` : ''}</section>`;

};

    <div class="rowbtn"><button type="button" class="btn danger sm" data-act="hold" data-v="confirmed">Confirmer l’opposition</button><button type="button" class="btn sec sm" data-act="hold" data-v="lifted">Lever la retenue</button></div></div></div>
    ${trBlock(cid)}<p class="mut" style="margin-top:10px">Confirmer ajoute le numéro à la liste des numéros opposés et supprime l’analyse. Lever libère l’analyse pour validation.</p>`;

  const total = c.heat.reduce((a, h) => a + h[1], 0);
  return `<div class="callhead"><span class="av lg n" aria-hidden="true">${initials(c.who)}</span><div class="grow"><b>Appel sortant · ${c.note} ${c.time}</b><div class="tx2">${c.dur} · ${esc(c.who)} avec ${esc(l.contact)} · <span class="mono">${esc(l.phone)}</span></div></div>
      <span class="chip ${st === 'valid' ? 'c-good' : 'c-warn'}">${ic(st === 'valid' ? 'check' : 'clock')}${st === 'valid' ? 'Analyse validée' : 'Analyse à valider'}</span>
      <div class="player" style="flex-basis:100%"><button type="button" class="btn sec icon" aria-label="Écouter l’enregistrement" data-act="toast" data-msg="Lecture de l’enregistrement (conservé 30 jours)">${ic('play')}</button><div class="wave" aria-hidden="true">${bars}</div><span class="mono tx2">01:11 / ${c.dur.replace(' min ', ':').replace(/^(\d):/, '0$1:')}</span></div></div>
    <p class="tx2" style="margin-bottom:12px">${ic('shield')} Aucune opposition du prospect pendant l’appel. ${S.hold === 'lifted' && cid === 'garage' ? 'Retenue levée par Raphael.' : ''}</p>
    <div class="section"><h3>Résumé</h3><div class="sum">${esc(c.summary)}</div></div>
    <div class="section"><h3>Transcript</h3>${trBlock(cid)}</div>
    ${c.fields.length ? `<div class="section"><h3>Informations proposées <span class="n">${done} sur ${c.fields.length} traitées</span></h3><div class="plist">${c.fields.map(f => propRow(cid, f)).join('')}</div></div>` : ''}
    ${c.heat.length ? `<div class="section"><h3>Chaleur par critère <span class="chip ${total >= 70 ? 'c-serious' : 'c-warn'}" style="margin-left:6px">${total >= 70 ? 'Chaud' : 'Tiède'} <span class="mono">${total}/100</span></span></h3><div class="heat">${c.heat.map(h => `<div class="row"><span>${h[0]}</span><div class="bar" role="img" aria-label="${h[0]} : ${h[1]} sur ${h[2]}"><i style="width:${h[1] / h[2] * 100}%"></i></div><span class="mono tx2" style="text-align:right">${h[1]}/${h[2]}</span></div>`).join('')}</div></div>` : ''}
    ${c.actions.length ? `<div class="section"><h3>Actions proposées</h3><div class="todo">${c.actions.map(a => { const s = S.actions[cid + a.k]; return `<div class="it">${ic(a.ic)}<div class="tt"><b>${a.l}</b><span>${a.v}</span></div>${s === 'ok' ? `<span class="chip c-good">${ic('check')}${a.done}</span>` : s === 'skip' ? '<span class="chip c-mut">Ignorée</span>' : `<button type="button" class="btn soft sm" data-act="act" data-c="${cid}" data-k="${a.k}" data-v="ok">Accepter</button><button type="button" class="btn ghost sm" data-act="act" data-c="${cid}" data-k="${a.k}" data-v="skip">Ignorer</button>`}</div>`; }).join('')}</div></div>` : ''}
    ${st === 'valid' ? '' : `<div class="foot-save"><span class="tx2">${accepted} information${accepted > 1 ? 's' : ''} acceptée${accepted > 1 ? 's' : ''} sur ${c.fields.length}. Valider les applique à la fiche.</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn soft" data-act="acceptall" data-c="${cid}">Accepter les citations vérifiées</button><button type="button" class="btn" data-act="validate" data-c="${cid}">${ic('check')} Valider l’analyse</button></div></div>`}`;

  const banners = `${isH ? `<div class="banner" style="--c:var(--crit)">${ic('shield')}<div class="grow"><b>Retenue pour opposition.</b> Le prospect a demandé à ne plus être rappelé à 9 h 31. Les appels sont suspendus jusqu’à votre décision.<div class="rowbtn"><a class="btn danger sm" href="#/appels/retenues/garage">Décider de la retenue</a></div></div></div>` : ''}
    ${l.outside ? `<div class="banner" style="--c:var(--warn)">${ic('clock')}<div class="grow"><b>Hors plage chez le prospect.</b> Il est ${l.local} à Fort-de-France. Les appels sont autorisés de 9 h à 19 h, heure du prospect : prochaine plage à 14 h 00, heure de Paris.</div></div>` : ''}
    ${l.voicemail ? `<div class="banner" style="--c:var(--crit)">${ic('flag')}<div class="grow"><b>Répondeur détecté hier.</b> La fiche porte la marque rouge jusqu’au prochain échange.</div></div>` : ''}

const CH = {};

  const n = o.pts.length, sx = i => x0 + (n === 1 ? 0 : i * (x1 - x0) / (n - 1)), sy = v => yB - (v - o.min) / (o.max - o.min) * (yB - yT);
  const vm = Math.max(...o.pts.map(p => p.vol), 1), bw = Math.max(3, (x1 - x0) / n * 0.6);

  const area = `${line}L${sx(n - 1)},${yB}L${sx(0)},${yB}Z`;
  const vols = o.pts.map((p, i) => p.vol ? `<rect class="vol ${i === n - 1 ? 'hi' : ''}" x="${(sx(i) - bw / 2).toFixed(1)}" y="${(vB - p.vol / vm * (vB - vT)).toFixed(1)}" width="${bw.toFixed(1)}" height="${(p.vol / vm * (vB - vT)).toFixed(1)}" rx="1.5"/>` : '').join('');

const hookCharts = () => $$('svg.chart[data-chart]').forEach(svg => {

const renderMain = r => {

};
const startLive = () => {

const render = () => {
  clearInterval(S.tm);

const openRoute = (id) => {
  const seg = parse(), o = seg[0];

const nextDialable = id => {

const fieldDialog = (c, k) => {

};
const act = (a) => {

    case 'obj': {

    case 'skipcard': { const n = nextDialable(d.id); toast('Fiche passée'); go(n ? `/leads/file/file/${n}` : '/leads/file/file'); break; }

    case 'opp': dlg('Opposition du prospect', `<p>Claire Martin demande à ne plus être appelée.</p><p class="tx2" style="margin-top:8px">L’appel s’arrête, la fiche est retenue et l’analyse attend votre décision. Le numéro n’est ajouté aux numéros opposés qu’à votre confirmation.</p>`, `<button type="button" class="btn sec" data-act="dlgclose">Continuer l’appel</button><button type="button" class="btn danger" data-act="oppok">Raccrocher et signaler l’opposition</button>`); break;
    case 'oppok': { const c = S.call; c.opposed = true; c.end = Math.floor((Date.now() - c.t0) / 1000); go('/leads/file/file/osteo/resultat'); break; }
    case 'saveres': { const c = S.call || {}; const n = nextDialable(d.id); S.call = null; S.result = 'joint'; toast(c.opposed ? 'Résultat enregistré : la fiche est retenue pour opposition' : 'Résultat enregistré, fiche suivante ouverte'); go(n ? `/leads/file/file/${n}${S.mode === 'power' ? '/appel' : ''}` : '/leads/file/file'); break; }
    case 'tab': { if (parse()[0] === 'lead') go(`/lead/${parse()[1]}/${d.t}`); else { S.tab.panel = d.t; rerender(); } break; }

    case 'fld': if (d.v === 'edit') fieldDialog(d.c, d.k); else { const f = CALLS[d.c].fields.find(x => x.k === d.k); if (d.v === 'reset') delete S.fields[d.c + d.k]; else S.fields[d.c + d.k] = { st: d.v, v: fs(d.c, f).v }; rerender(); } break;
    case 'fldsave': { S.fields[d.c + d.k] = { st: 'ok', v: $('#edv').value || '' }; closeDlg(); rerender(); break; }

    case 'validate': { const n = CALLS[d.c].fields.filter(f => fs(d.c, f).st === 'ok').length; S.validated[d.c] = true; toast(`Analyse validée : ${n} information${n > 1 ? 's' : ''} appliquée${n > 1 ? 's' : ''} à la fiche`); rerender(); break; }
    case 'cite': { S.hl = d.c + d.t; rerender(); const el = $('#t-' + d.c + '-' + d.t.replace(':', '')); if (el) el.scrollIntoView({ block: 'center' }); break; }
    case 'note': dlg('Consigner un échange', `<div class="frm"><div><label class="lab" for="nn">Compte rendu</label><textarea class="inp" id="nn" placeholder="Ce qui s’est dit, ce qui est décidé"></textarea></div><div><label class="lab" for="nd">Prochaine action</label><input class="inp" id="nd" value="${esc(byId(d.id).next)}"></div></div>`, `<button type="button" class="btn sec" data-act="dlgclose">Annuler</button><button type="button" class="btn" data-act="dlgok" data-msg="Échange consigné sur ${esc(byId(d.id).name)}">Consigner</button>`); break;

    case 'merge': dlg('Fusionner une fiche', `<p class="tx2" style="margin-bottom:12px">Aucun doublon détecté pour ${esc(byId(d.id).name)}. Vous pouvez tout de même choisir une fiche à fusionner dans celle-ci : ses appels et ses échanges sont conservés.</p><label class="lab" for="mg">Fiche à fusionner</label><select class="sel inp" id="mg">${L.filter(x => x.id !== d.id).map(x => `<option>${esc(x.name)}</option>`).join('')}</select>`, `<button type="button" class="btn sec" data-act="dlgclose">Annuler</button><button type="button" class="btn danger" data-act="dlgok" data-msg="Fiches fusionnées">Fusionner</button>`); break;

    case 'import': dlg('Importer une liste d’appel', `<label class="lab" for="imf">Fichier CSV</label><input class="inp" id="imf" type="file" accept=".csv"><label style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="impro"> Je confirme que ces contacts sont des professionnels, pas des particuliers.</label>`, `<button type="button" class="btn sec" data-act="dlgclose">Annuler</button><button type="button" class="btn" data-act="dlgok" data-msg="Import lancé">Importer</button>`); break;
    case 'addopp': { const v = $('#opp-n').value.trim(); if (!v) { toast('Saisissez un numéro'); break; } const tr = document.createElement('tr'); tr.style.cursor = 'default'; tr.innerHTML = `<td class="mono">${esc(v)}</td><td>Ajout manuel</td><td class="mono tx2">Ven. 13 nov.</td><td></td>`; $('#opp-t tbody').prepend(tr); $('#opp-n').value = ''; toast('Numéro ajouté aux numéros opposés'); break; }

const renderNavOnly = () => { renderNav({ seg: parse(), view: currentView() }); };

document.addEventListener('click', e => {

  const a = t.closest('[data-act]');

document.addEventListener('keydown', e => {

document.addEventListener('change', e => {
