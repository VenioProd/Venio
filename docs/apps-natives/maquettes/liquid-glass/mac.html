<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venio · Liquid Glass · Mac</title>
<meta name="description" content="Maquettes macOS de l’espace admin, piste Liquid Glass.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<script src="../locale-demo.js"></script>
<script src="../theme-panel.js" data-track="glass"></script>
<style>
:root{
  --orange:#ff9f0a;--green:#30d158;--amber:#d99a00;--pink:#f472b6;
  --t1:#0d1424;--t2:rgba(38,50,82,.74);--t3:rgba(38,50,82,.5);
  --glass:rgba(255,255,255,.46);--glass-2:rgba(255,255,255,.64);--glass-3:rgba(255,255,255,.26);
  --fill:rgba(110,122,170,.14);--fill-2:rgba(110,122,170,.24);--sep:rgba(60,72,110,.12);
  --hi:rgba(255,255,255,.92);--lo:rgba(255,255,255,.2);
  --rim-a:rgba(255,255,255,.98);--rim-b:rgba(255,255,255,.12);--rim-c:rgba(255,255,255,.72);
  --shadow:0 14px 34px -10px rgba(0,0,0,.26),0 2px 6px rgba(0,0,0,.06);
  --font:-apple-system,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;
}
.dark{
  --accent-ink:color-mix(in srgb,var(--accent) 55%,#fff);
  --urgent-ink:color-mix(in srgb,var(--urgent) 55%,#fff);--violet-ink:color-mix(in srgb,var(--violet) 55%,#fff);
  --t1:rgba(255,255,255,.96);--t2:rgba(226,232,255,.68);--t3:rgba(226,232,255,.42);
  --glass:rgba(34,40,78,.46);--glass-2:rgba(70,80,138,.5);--glass-3:rgba(255,255,255,.07);
  --fill:rgba(180,190,255,.13);--fill-2:rgba(180,190,255,.22);--sep:rgba(255,255,255,.1);
  --hi:rgba(255,255,255,.3);--lo:rgba(255,255,255,.05);
  --rim-a:rgba(255,255,255,.55);--rim-b:rgba(255,255,255,.05);--rim-c:rgba(255,255,255,.32);
  --shadow:0 16px 36px -10px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.2);
  color:var(--t1)
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{font-family:var(--font);color:var(--t1);background:var(--bg-base);background:var(--bg-image);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;line-height:1.3}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:default}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.f{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- Verre ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(185%);backdrop-filter:blur(24px) saturate(185%);box-shadow:var(--shadow),inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),inset 0 0 22px rgba(255,255,255,.1)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(135deg,var(--rim-a),var(--rim-b) 34%,var(--rim-b) 66%,var(--rim-c));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass.thin{background:var(--glass-3);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.glass.thick{background:var(--glass-2);-webkit-backdrop-filter:blur(34px) saturate(200%);backdrop-filter:blur(34px) saturate(200%)}
.glass.tint-accent{color:var(--on-accent);background:linear-gradient(180deg,var(--accent-hi),var(--accent))}
.glass.tint-violet{background:linear-gradient(180deg,rgb(var(--violet-rgb) / .6),rgb(var(--violet-rgb) / .48))}
.inset{background:var(--fill);border-radius:14px}

/* ---------- Typo ---------- */
.large{font-size:34px;font-weight:700;letter-spacing:-.032em;line-height:1.05}
.t22{font-size:22px;font-weight:700;letter-spacing:-.022em}
.hd{font-size:17px;font-weight:600}
.sub{font-size:13px;color:var(--t2)}
.c2{font-size:11.5px;color:var(--t3)}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--t2);padding:0 8px;height:24px;margin-top:10px}
.sec .ct{font-size:11px;min-width:20px;height:18px;padding:0 6px;border-radius:9px;display:inline-grid;place-items:center;background:var(--fill);color:var(--t2)}
.sec .ct.red{background:rgb(var(--urgent-rgb) / .16);color:var(--urgent-ink)}

/* ---------- Puces ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600;background:var(--fill);color:var(--t2);white-space:nowrap}
.chip .ico{width:12px;height:12px;stroke-width:2.2}
.c-red{background:rgb(var(--urgent-rgb) / .15);color:var(--urgent-ink)}
.c-orange{background:rgba(255,159,10,.17);color:#b25e00}
.c-amber{background:rgba(234,179,8,.18);color:#8a6500}
.c-green{background:rgba(48,209,88,.17);color:#117a32}
.c-sky{background:rgb(var(--accent-rgb) / .16);color:var(--accent-ink)}
.c-violet{background:rgb(var(--violet-rgb) / .17);color:var(--violet-ink)}
.c-slate{background:rgba(100,116,139,.17);color:#475569}
.dark .c-orange,html[data-bg=night] .c-orange,.dark .lic.c-orange,html[data-bg=night] .lic.c-orange{color:#ffc069}.dark .c-amber,html[data-bg=night] .c-amber,.dark .lic.c-amber,html[data-bg=night] .lic.c-amber{color:#fcd34d}.dark .c-green,html[data-bg=night] .c-green,.dark .lic.c-green,html[data-bg=night] .lic.c-green{color:#6ee79a}.dark .c-slate,html[data-bg=night] .c-slate,.dark .lic.c-slate,html[data-bg=night] .lic.c-slate{color:#b6c2d6}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--t3)}
.d-red{background:var(--urgent);box-shadow:0 0 0 3px rgb(var(--urgent-rgb) / .18)}
.d-orange{background:var(--orange);box-shadow:0 0 0 3px rgba(255,159,10,.18)}
.d-amber{background:#eab308;box-shadow:0 0 0 3px rgba(234,179,8,.2)}
.d-slate{background:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.2)}
.d-green{background:var(--green);box-shadow:0 0 0 3px rgba(48,209,88,.18)}

/* ---------- Avatars ---------- */
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--on-accent);flex:none;background:linear-gradient(135deg,var(--accent-hi),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 3px color-mix(in srgb,var(--accent-lo) 30%,transparent)}
.av.v{background:linear-gradient(135deg,var(--accent-hi),var(--accent-lo));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 3px rgb(var(--accent-rgb) / .3)}
.av.n{background:transparent;color:var(--t3);border:1.5px dashed var(--t3);box-shadow:none}
.av.k{color:#fff;background:linear-gradient(135deg,#475569,#1e293b)}
.av.s{width:20px;height:20px;font-size:8.5px}
.av.l{width:64px;height:64px;font-size:22px;border-radius:22px}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 15px;border-radius:18px;font-size:15px;font-weight:600;color:var(--t1)}
.btn.prim{color:var(--on-accent);background:linear-gradient(180deg,var(--accent-hi),var(--accent) 70%,var(--accent-lo));box-shadow:0 8px 20px -6px rgb(var(--accent-rgb) / .7),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.08);-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.prim::after{opacity:.9}
.btn.sm{height:30px;padding:0 12px;font-size:13px;border-radius:15px}
.btn.lg{height:52px;border-radius:26px;font-size:17px;padding:0 22px}
.circ{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;flex:none;color:var(--t1)}
.circ.sm{width:32px;height:32px}
.circ.sm .ico{width:16px;height:16px}
.circ.sky{color:var(--on-accent);background:linear-gradient(180deg,var(--accent-hi),var(--accent));-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 6px 16px -4px rgb(var(--accent-rgb) / .65),inset 0 1px 0 rgba(255,255,255,.7)}
.circ.green{color:#fff;background:linear-gradient(180deg,#4ade80,#22c55e);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 6px 16px -4px rgba(34,197,94,.6),inset 0 1px 0 rgba(255,255,255,.7)}
.circ.redb{color:#fff;background:linear-gradient(180deg,var(--urgent),var(--urgent));-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 6px 16px -4px rgb(var(--urgent-rgb) / .6),inset 0 1px 0 rgba(255,255,255,.6)}
.seg{display:inline-flex;padding:3px;border-radius:19px;gap:2px}
.seg span{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 14px;border-radius:15px;font-size:13px;font-weight:600;color:var(--t2);white-space:nowrap}
.seg span.on{color:var(--t1);background:var(--glass-2);box-shadow:0 2px 8px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.95)}
.dark .seg span.on,html[data-bg=night] .seg span.on{box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.seg span small{font-size:11px;font-weight:600;color:var(--t3)}
.bar{height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent-hi),var(--accent))}
.bar.v i{background:linear-gradient(90deg,var(--violet),var(--violet))}

/* ---------- Pile d'icones (tab bar) ---------- */
.tabbar{position:absolute;left:14px;right:14px;bottom:22px;display:flex;gap:8px;z-index:30}
.tabs{flex:1;height:64px;border-radius:32px;display:flex;padding:3px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:-.02em;color:var(--t2);border-radius:29px;position:relative}
.tab .ico{width:22px;height:22px}
.tab.on{color:var(--accent-ink);background:linear-gradient(180deg,var(--glass-2),var(--glass));box-shadow:0 3px 10px rgb(var(--accent-rgb) / .2),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.4)}
.dark .tab.on,html[data-bg=night] .tab.on{color:var(--accent-hi);background:linear-gradient(180deg,color-mix(in srgb,var(--accent-hi) 28%,transparent),color-mix(in srgb,var(--accent-hi) 10%,transparent));box-shadow:0 3px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.fab{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.fab .ico{width:26px;height:26px;stroke-width:2.1}

/* ---------- Page ---------- */
.topnav{position:sticky;top:12px;z-index:100;margin:12px auto 0;width:min(940px,calc(100% - 24px));height:52px;border-radius:26px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 8px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.02em;padding-left:2px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--on-accent);font-weight:800;font-size:17px;background:linear-gradient(135deg,var(--accent-hi),var(--accent-lo));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px -2px rgb(var(--accent-rgb) / .5)}
.brand em{font-style:normal;font-weight:500;color:var(--t2);margin-left:2px}
.links{display:flex;gap:2px}
.links a{height:36px;padding:0 14px;border-radius:18px;display:inline-flex;align-items:center;font-size:14px;font-weight:600;color:var(--t2)}
.links a[aria-current]{color:var(--t1);background:var(--glass-2);box-shadow:0 2px 8px rgba(0,0,0,.14),inset 0 1px 0 #fff}
.page{max-width:1500px;margin:0 auto;padding:36px 16px 80px}
.intro{max-width:760px;margin:0 auto 34px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:13px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
.intro h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.04em;line-height:1.02;font-weight:800;margin:14px 0 12px}
.intro p{font-size:17px;color:var(--t2);line-height:1.45}
.stage{display:flex;flex-wrap:wrap;justify-content:center;gap:44px 40px}
.cell{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
.cap{max-width:360px;text-align:center}
.cap b{display:block;font-size:15px;font-weight:700}
.cap b i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent-hi),var(--accent-lo));margin-right:7px;vertical-align:1px}
.cap span{display:block;font-size:13.5px;color:var(--t2);margin-top:3px;line-height:1.4}
.cap.wide{max-width:640px}

/* ---------- Mise a l'echelle des appareils ---------- */
.fit{--s:1;--m:14;position:relative;width:calc((var(--w) + 2 * var(--m)) * var(--s) * 1px);height:calc((var(--h) + 2 * var(--m)) * var(--s) * 1px);max-width:100%}
.fit>.dev{position:absolute;left:calc(var(--m) * var(--s) * 1px);top:calc(var(--m) * var(--s) * 1px);transform:scale(var(--s));transform-origin:0 0;width:calc(var(--w) * 1px);height:calc(var(--h) * 1px)}
.dev{overflow:hidden;position:relative;font-family:var(--font);color:var(--t1)}

/* ---------- iPhone ---------- */
.phone{width:393px;height:852px;border-radius:56px;box-shadow:0 0 0 8px #0e1014,0 0 0 9.5px #565b66,0 38px 70px -14px rgba(0,0,0,.55);overflow:hidden}
.bg-a{background:
  radial-gradient(260px 240px at 6% 3%,var(--halo-1),transparent 70%),
  radial-gradient(280px 260px at 100% 26%,var(--halo-2),transparent 70%),
  radial-gradient(300px 260px at 0% 64%,var(--halo-1),transparent 70%),
  radial-gradient(280px 240px at 96% 100%,var(--halo-2),transparent 70%),
  var(--bg-base)}
.bg-b{background:
  radial-gradient(280px 260px at 96% 2%,var(--halo-2),transparent 70%),
  radial-gradient(260px 260px at 0% 34%,var(--halo-1),transparent 70%),
  radial-gradient(300px 260px at 100% 70%,var(--halo-1),transparent 70%),
  radial-gradient(260px 240px at 4% 100%,var(--halo-2),transparent 70%),
  var(--bg-base)}
.bg-c{background:
  radial-gradient(260px 240px at 0% 0%,var(--halo-2),transparent 70%),
  radial-gradient(280px 260px at 100% 20%,var(--halo-1),transparent 70%),
  radial-gradient(300px 260px at 0% 58%,var(--halo-2),transparent 70%),
  radial-gradient(300px 260px at 100% 100%,var(--halo-1),transparent 70%),
  var(--bg-base)}
.bg-dark{background:
  radial-gradient(300px 260px at 10% 6%,rgb(var(--accent-rgb) / .5),transparent 70%),
  radial-gradient(300px 280px at 100% 40%,color-mix(in srgb,var(--accent-lo) 50%,transparent),transparent 70%),
  radial-gradient(320px 260px at 0% 90%,color-mix(in srgb,var(--accent-hi) 30%,transparent),transparent 70%),
  linear-gradient(180deg,#0b1030,#140f33)}
.island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:59px;padding:11px 34px 0 48px;display:flex;justify-content:space-between;align-items:center;z-index:50;font-weight:600;font-size:17px}
.status .time{width:70px;text-align:center;margin-left:-14px;height:37px;line-height:37px}
.status .si{display:flex;gap:6px;align-items:center;height:37px;margin-right:-10px}
.status svg{height:12px;width:auto;fill:currentColor}
.home{position:absolute;bottom:8px;left:50%;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:rgba(10,14,30,.85);z-index:70}
.dark .home,html[data-bg=night] .home{background:rgba(255,255,255,.85)}
.edge-top{position:absolute;top:0;left:0;right:0;height:62px;z-index:40;pointer-events:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.scroll{position:absolute;inset:0;padding:60px 16px 0;z-index:1}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px 6px}
.hdr .sub{margin-bottom:2px}
.navrow{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 2px}
.card{border-radius:26px;padding:4px}
.lrow{display:flex;align-items:center;gap:11px;min-height:54px;padding:7px 10px 7px 8px;border-radius:22px}
.lrow+.lrow{box-shadow:0 -1px 0 var(--sep)}
.lic{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--fill);color:var(--t2)}
.lic .ico{width:19px;height:19px}
.lic.c-red{background:rgb(var(--urgent-rgb) / .16);color:var(--urgent-ink)}.lic.c-sky{background:rgb(var(--accent-rgb) / .17);color:var(--accent-ink)}.lic.c-violet{background:rgb(var(--violet-rgb) / .17);color:var(--violet-ink)}.lic.c-orange{background:rgba(255,159,10,.18);color:#b25e00}.lic.c-green{background:rgba(48,209,88,.18);color:#117a32}
.lmain{flex:1;min-width:0}
.lmain b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.016em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmain small{display:block;font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ltail{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.ltail b{font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums}
.ltail small{font-size:11.5px;color:var(--t2)}

/* ---------- Legendes d'index ---------- */
.mat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}

@media (max-width:560px){
  .brand em,.brand .bt{display:none}
  .links a{padding:0 9px;font-size:13.5px}
  .page{padding-top:26px}
  .stage{gap:34px 0}
}
@media (prefers-reduced-motion:no-preference){
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgb(var(--accent-rgb) / .5)}50%{box-shadow:0 0 0 7px rgb(var(--accent-rgb) / 0)}}
  @keyframes rec{0%,100%{opacity:1}50%{opacity:.35}}
}


.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .xl{position:absolute;transform:translate(-104%,-128%);padding:7px 12px 8px;border-radius:16px;white-space:nowrap;font-size:12px;line-height:1.25;color:var(--t1)}
.chart .xl b{display:block;font-size:17px;letter-spacing:-.02em;font-weight:750}
.chart .xl span{color:var(--t2);font-weight:500}
.chart .xl.sm{transform:translate(-50%,-170%);padding:4px 11px;border-radius:14px;display:flex;gap:7px;align-items:baseline}
.chart .xl.sm b{display:inline;font-size:13.5px}
.chart text{font-family:var(--font);font-size:11px;fill:var(--t3);font-variant-numeric:tabular-nums}


.hbtn{width:40px;height:40px}
.hero2{border-radius:26px;padding:9px 14px 10px;margin-top:8px}
.hero2 .r{display:flex;justify-content:space-between;align-items:flex-end}
.hero2 .l{font-size:11.5px;font-weight:600;color:var(--t2)}
.hero2 .v{font-size:25px;font-weight:750;letter-spacing:-.03em;line-height:1.1}
.stack{display:flex;gap:2px;height:7px;margin-top:7px;border-radius:4px;overflow:hidden}
.stack i{display:block;height:100%}
.sthead{display:flex;align-items:center;gap:7px;height:26px;padding:0 10px;font-size:12.5px}
.sthead b{font-size:13px;font-weight:700;letter-spacing:-.01em}
.sthead .ct{min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:var(--fill);font-size:10.5px;font-weight:700;display:inline-grid;place-items:center;color:var(--t2)}
.sthead .pr{font-size:10.5px;font-weight:700;color:var(--violet-ink)}
.sthead .sp{flex:1}
.sthead .sm{font-weight:700;font-variant-numeric:tabular-nums}
.sthead .wt{color:var(--accent-ink);font-weight:600;font-variant-numeric:tabular-nums;font-size:11.5px}

.kpi .vv{font-size:34px;font-weight:750;letter-spacing:-.038em;margin-top:8px;line-height:1.05}
.kpi .ss{font-size:12.5px;color:var(--t2);margin-top:5px;display:flex;align-items:center;gap:6px}
.kpi.red{background:linear-gradient(180deg,rgb(var(--urgent-rgb) / .2),rgba(255,255,255,.4))}
.kpi.red .vv{color:var(--urgent-ink)}
.row2{display:grid;grid-template-columns:1fr 392px;gap:14px;flex:1;min-height:0}
.panel{border-radius:30px;padding:18px 20px;display:flex;flex-direction:column;min-height:0}
.panel h2{font-size:17px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.panel .ph2{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2);font-weight:600;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cstats{display:flex;gap:12px;margin-top:auto;padding-top:10px}
.cstats div{flex:1;padding:10px 14px;border-radius:18px;background:var(--fill)}
.cstats small{display:block;font-size:11.5px;color:var(--t2);font-weight:600}
.cstats b{font-size:19px;letter-spacing:-.025em;font-weight:750;font-variant-numeric:tabular-nums}
.inv{display:flex;align-items:center;gap:12px;padding:27px 0}
.inv+.inv{box-shadow:0 -1px 0 var(--sep)}
.inv .mm{flex:1;min-width:0}
.inv .mm b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.015em}
.inv .mm small{display:block;font-size:12px;color:var(--t2);margin-top:1px}
.inv .am{font-size:16px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right}
.inv .am small{display:block;font-size:11.5px;font-weight:600;color:var(--urgent-ink);letter-spacing:0}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:none}
.mt{display:flex;align-items:center;gap:14px;padding:0 18px;height:84px;border-radius:26px}
.mt .ib{width:44px;height:44px;border-radius:15px;display:grid;place-items:center}
.mt .ib .ico{width:22px;height:22px}
.mt b{display:block;font-size:28px;font-weight:750;letter-spacing:-.035em;line-height:1.05}
.mt small{font-size:12.5px;color:var(--t2);font-weight:600}
/* fenetre 2 */
.cols2{display:grid;grid-template-columns:300px 1fr;gap:14px;flex:1;min-height:0}
.plist{border-radius:30px;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.plist .pi{margin:0}
.pdet{display:flex;flex-direction:column;gap:14px;min-height:0}
.dhead{border-radius:30px;padding:16px 20px;display:flex;align-items:center;gap:16px;flex:none}
.dhead h1{font-size:28px;font-weight:750;letter-spacing:-.036em;line-height:1.05;white-space:nowrap}
.dhead .sub{white-space:nowrap}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
.dcol{display:flex;flex-direction:column;gap:14px;min-height:0}
.card2{border-radius:28px;padding:16px 18px}
.card2 h3{font-size:15px;font-weight:700;letter-spacing:-.015em;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phr{display:flex;align-items:center;gap:10px;height:38px;font-size:14px;font-weight:600}
.phr+.phr{box-shadow:0 -1px 0 var(--sep)}
.phr .no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--fill-2);color:var(--t2)}
.phr .no.d{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:var(--on-accent)}
.phr .no.c{background:var(--glass-2);color:var(--accent-ink);box-shadow:0 0 0 3px rgb(var(--accent-rgb) / .35)}
.dd{display:inline-flex;align-items:center;gap:5px;margin-left:auto;height:28px;padding:0 10px;border-radius:14px;font-size:12.5px;font-weight:600;background:var(--fill)}
.dd .ico{width:12px;height:12px;stroke-width:2.4;color:var(--t3)}
.slider{position:relative;height:8px;border-radius:4px;background:var(--fill-2);margin:12px 4px 6px}
.slider i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--accent-hi),var(--accent))}
.slider u{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--glass-2);box-shadow:0 3px 10px color-mix(in srgb,var(--accent-lo) 40%,transparent),inset 0 1px 0 #fff,0 0 0 1px rgb(var(--accent-rgb) / .25)}
.fld{display:flex;align-items:center;justify-content:space-between;height:40px;font-size:13.5px}
.fld+.fld{box-shadow:0 -1px 0 var(--sep)}
.fld span{color:var(--t2);font-weight:600;font-size:13px}
.inp{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:10px;background:var(--glass-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 1px 3px rgba(0,0,0,.12);font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.req{display:flex;gap:11px;padding:10px 12px;border-radius:20px;align-items:flex-start}
.req+.req{margin-top:6px}
.req.on{background:var(--glass-2);box-shadow:0 8px 20px -8px rgb(var(--accent-rgb) / .45),inset 0 0 0 2px rgb(var(--accent-rgb) / .8),inset 0 1px 0 #fff}
.req .m{flex:1;min-width:0}
.req b{font-size:14px;font-weight:650;letter-spacing:-.012em;display:block}
.req small{font-size:12px;color:var(--t2);display:block;margin-top:1px}
.tri{display:flex;gap:6px;margin-top:9px}
.tri .btn{height:28px;font-size:12px;padding:0 11px}
.ed-t{height:36px;display:flex;align-items:center;padding:0 12px;border-radius:12px;background:var(--glass-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 1px 3px rgba(0,0,0,.12);font-size:14px;font-weight:650}
.ed-b{margin-top:8px;padding:11px 12px;border-radius:14px;background:var(--glass-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 1px 3px rgba(0,0,0,.12);font-size:13.5px;line-height:1.45;min-height:78px}
.ed-b .caret{display:inline-block;width:2px;height:15px;background:var(--accent);vertical-align:-3px;margin-left:1px}
.ed-bar{display:flex;gap:2px;margin-top:8px;align-items:center}
.ed-bar span{width:30px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--t2);font-weight:700;font-size:13px}
.ed-bar span.on{background:var(--fill-2)}
.tgl{display:flex;align-items:center;justify-content:space-between;height:34px;font-size:13px;font-weight:600}
.sw{width:42px;height:25px;border-radius:13px;background:var(--fill-2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--glass-2);box-shadow:0 2px 5px rgba(0,0,0,.25)}
.sw.on{background:linear-gradient(180deg,#4ade80,#22c55e)}
.sw.on::after{left:19px}


/* Les vignettes gardent leur palette pour prévisualiser chaque thème. */
.appearance h3{font-size:13px;font-weight:650;color:var(--t2);margin:14px 4px 8px}
.appearance-themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.appearance-options{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.appearance button{cursor:pointer;position:relative;min-width:0;border-radius:14px;padding:5px;font-size:10px;font-weight:600;text-align:center}
.appearance button:focus-visible,.settings-open:focus-visible,.settings-close:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.appearance button[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent)}
.appearance button[aria-pressed=true]::after{content:"✓";position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800}
.appearance-swatch{display:block;height:40px;border-radius:10px;margin-bottom:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
[data-accents] .appearance-swatch{width:32px;height:32px;border-radius:50%;margin:2px auto 7px}
[data-accents] button[aria-pressed=true]::after{left:50%;right:auto;top:14px;transform:translateX(-50%);width:14px;height:14px;background:transparent}
.appearance-mini{display:block;height:68px;border-radius:11px;margin-bottom:6px;position:relative;overflow:hidden}
.appearance-mini::before{content:"";position:absolute;inset:10px 12px 28px;border-radius:8px}
.appearance-mini::after{content:"";position:absolute;left:12px;right:36px;bottom:12px;height:9px;border-radius:5px}
.appearance-mini.glass-preview{background:radial-gradient(at 0 0,#bae6fd,transparent 70%),radial-gradient(at 100% 100%,#ddd6fe,transparent 70%),#eef3f8}
.glass-preview::before{background:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(0,0,0,.1)}
.glass-preview::after{background:#0ea5e9}
.appearance-mini.neon-preview{background:#050505}
.neon-preview::before{background:#0d0f12;border:1px solid #0ea5e9;box-shadow:0 0 10px rgba(14,165,233,.2)}
.neon-preview::after{background:#0ea5e9;box-shadow:0 0 9px rgba(14,165,233,.5)}
.appearance-tags{display:flex;gap:6px;padding:0 10px}
.appearance-lead .nxt{margin:0;padding:9px 10px;box-shadow:none}
.appearance-lead .nxt b{font-size:12px}
.appearance-chart{border-radius:20px;padding:12px;margin-top:8px}
.appearance-chart svg{width:100%;height:90px;overflow:hidden}

.settings-open{margin-top:auto;width:100%;cursor:pointer;text-align:left}
.settings-open+.muser{margin-top:6px}
.settings-sheet{position:absolute;inset:0;margin:auto;width:760px;height:fit-content;max-width:calc(100% - 80px);max-height:calc(100% - 60px);padding:24px 28px;border:0;border-radius:30px;color:var(--t1);overflow-y:auto;z-index:90}
.settings-sheet:not([open]){display:none}
.settings-sheet[open]{display:block}
.mac:has(.settings-sheet[open])::after{content:"";position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.35);border-radius:inherit}
.settings-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.settings-heading h2{font-size:25px;letter-spacing:-.03em}
.settings-sheet .appearance-mini{height:88px}
.settings-sheet .appearance-swatch{height:48px}
.settings-sheet [data-accents] .appearance-swatch{width:38px;height:38px}
.settings-sheet .appearance button{font-size:12px}
.settings-sheet .appearance-lead{display:grid;grid-template-columns:1fr auto;align-items:center;padding:4px 8px}
.settings-sheet .appearance-lead .lrow{min-width:0}
.settings-sheet .appearance-lead .nxt{grid-column:1/-1}

.language h3{font-size:13px;font-weight:650;color:var(--t2);margin:14px 4px 8px}
.locale-segments{display:flex;gap:2px;padding:3px;border-radius:19px;background:var(--glass-3);box-shadow:inset 0 0 0 1px var(--sep)}
.language .locale-segments button{flex:1;min-width:0;padding:8px 6px;border-radius:15px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer}
.language .locale-segments button[aria-pressed=true]{color:var(--t1);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--hi)}
.language .locale-segments button[aria-pressed=true]::after{content:none}
.locale-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 4px 6px;font-size:14px;font-weight:600}
.language .locale-switch{position:relative;flex:none;width:44px;height:28px;padding:0;border-radius:14px;background:var(--fill-2);cursor:pointer}
.language .locale-switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--hi)}
.language .locale-switch[aria-checked=true]{background:var(--accent)}
.language .locale-switch[aria-checked=true]::after{left:19px;background:var(--on-accent)}
.locale-help{margin:0 4px;font-size:12px;line-height:1.45;color:var(--t2)}
.language button:focus-visible,.tn-flag:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.settings-sheet .appearance-mini{height:56px}
.settings-sheet .appearance-swatch{height:32px}
.settings-sheet [data-accents] .appearance-swatch{width:30px;height:30px}
.settings-sheet .appearance h3{margin-top:10px;margin-bottom:6px}
.settings-sheet .appearance-chart{padding:8px;margin-top:6px}
.settings-sheet .appearance-chart svg{height:52px}
</style>

<script>(function(){
var api=window.VenioTheme,track=api.tracks[api.track];
document.querySelectorAll('.appearance').forEach(function(panel){
  function choice(group,key,label,preview){
    var button=document.createElement('button');button.type='button';
    button.dataset.group=group;button.dataset.key=key;
    button.setAttribute('aria-label',label);button.setAttribute('aria-pressed','false');
    var swatch=document.createElement('span');swatch.setAttribute('aria-hidden','true');
    swatch.className=group==='theme'?'appearance-mini '+key+'-preview':'appearance-swatch';
    if(preview)swatch.style.background=preview;
    button.appendChild(swatch);button.appendChild(document.createTextNode(label));
    button.addEventListener('click',function(){
      if(group==='theme'){api.switchTo(key);return;}
      var patch={};patch[group]=key;api.set(patch);
    });
    return button;
  }
  Object.keys(api.tracks).forEach(function(key){panel.querySelector('[data-themes]').appendChild(choice('theme',key,api.tracks[key].label));});
  track.backgrounds.forEach(function(item){panel.querySelector('[data-backgrounds]').appendChild(choice('background',item.key,item.label,item.css));});
  track.accents.forEach(function(item){panel.querySelector('[data-accents]').appendChild(choice('accent',item.key,item.label,item.css));});
  function sync(state){panel.querySelectorAll('button[data-group]').forEach(function(button){button.setAttribute('aria-pressed',String(state[button.dataset.group]===button.dataset.key));});}
  sync(api.get());api.onChange(sync);
});
})();</script>

<script>(function(){
var active=null,opener=null;
function close(){if(!active)return;active.close();active.closest('.mac').querySelectorAll(':scope > aside,:scope > .mmain').forEach(function(el){el.inert=false;});active=null;if(opener)opener.focus();}
function open(button){if(active)close();opener=button;active=button.closest('.mac').querySelector('.settings-sheet');active.show();active.closest('.mac').querySelectorAll(':scope > aside,:scope > .mmain').forEach(function(el){el.inert=true;});active.setAttribute('aria-modal','true');active.querySelector('.settings-close').focus();}
document.querySelectorAll('.settings-open').forEach(function(button){button.addEventListener('click',function(){open(button);});});
document.querySelectorAll('.settings-sheet').forEach(function(sheet){sheet.querySelector('form').addEventListener('submit',function(event){event.preventDefault();close();});});
document.addEventListener('keydown',function(event){
  if(!active)return;
  if(event.key==='Escape'){event.preventDefault();close();}
  if(event.key==='Tab'){var buttons=active.querySelectorAll('button'),first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
});
function hash(){if(location.hash==='#reglages')open(document.querySelector('.settings-open'));}
window.addEventListener('hashchange',hash);hash();
})();</script>

<script>(function(){
var api=window.VenioLocale;
document.querySelectorAll('.language').forEach(function(panel){
  panel.querySelectorAll('[data-locale]').forEach(function(button){
    button.addEventListener('click',function(){api.set({locale:button.dataset.locale});});
  });
  var toggle=panel.querySelector('.locale-switch');
  toggle.addEventListener('click',function(){api.set({autoTranslate:!api.get().autoTranslate});});
  function sync(state){
    panel.querySelectorAll('[data-locale]').forEach(function(button){button.setAttribute('aria-pressed',String(state.locale===button.dataset.locale));});
    toggle.setAttribute('aria-checked',String(state.autoTranslate));
  }
  sync(api.get());api.onChange(sync);
});
})();</script>
