<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM — Venio Admin</title>
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ───────── Tokens (Système) ───────── */
:root {
  --bg:#04050a; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --tx:#eef0f7; --mut:#9aa1b4; --dim:#7a8197;
  --sky:#38bdf8; --vio:#a78bfa; --teal:#5eead4; --mint:#34d399; --amber:#fbbf24; --rose:#f472b6;
  --grad:linear-gradient(92deg,#c4b5fd 0%,#7dd3fc 45%,#5eead4 100%);
  --f1:rgba(255,255,255,.03); --f2:rgba(255,255,255,.05); --f3:rgba(255,255,255,.08);
  --topbg:rgba(6,7,12,.72); --sheet:#0a0c14; --pbtn:#f4f6fb; --pbtx:#05060b;
  --r:14px; --sidew:248px;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
  --safe:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"] {
  --bg:#f5f6fa; --line:rgba(10,14,30,.1); --line-2:rgba(10,14,30,.18);
  --tx:#0b0d16; --mut:#4b5266; --dim:#667088;
  --sky:#0284c7; --vio:#7c3aed; --teal:#0d9488; --mint:#059669; --amber:#b45309; --rose:#be185d;
  --f1:rgba(10,14,30,.025); --f2:rgba(10,14,30,.04); --f3:rgba(10,14,30,.07);
  --topbg:rgba(245,246,250,.8); --sheet:#ffffff; --pbtn:#0b0d16; --pbtx:#fff;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(700px 420px at 12% -6%,rgba(56,189,248,.075),transparent 70%)}
:root[data-theme="light"] body::before{background:radial-gradient(700px 420px at 12% -6%,rgba(56,189,248,.14),transparent 70%)}
a{color:inherit;text-decoration:none}
svg{display:block}
h1,h2,h3,h4,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
::selection{background:rgba(125,211,252,.3)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);letter-spacing:.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--pbtn);color:var(--pbtx);padding:8px 14px;border-radius:99px}
.skip:focus{top:12px}

/* ───────── Buttons ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;transition:background .2s,box-shadow .25s,border-color .2s}
.btn-primary{color:var(--pbtx);background:var(--pbtn);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 8px 30px -10px rgba(125,211,252,.55)}
.btn-primary:hover{box-shadow:0 0 0 1px rgba(255,255,255,.55) inset,0 10px 36px -8px rgba(125,211,252,.7),0 0 0 4px rgba(125,211,252,.12)}
.btn-ghost{background:var(--f2);border:1px solid var(--line-2)}
.btn-ghost:hover{background:var(--f3)}
.btn-sm{height:30px;padding:0 12px;font-size:12.5px}
.ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mut);position:relative;transition:background .2s,color .2s}
.ibtn:hover{background:var(--f3);color:var(--tx)}

/* ───────── Glass / spot ───────── */
.glass{position:relative;border-radius:var(--r);background:linear-gradient(180deg,var(--f2),var(--f1));border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -30px rgba(0,0,0,.7)}
.spot{--mx:-999px;--my:-999px;isolation:isolate}
.spot::before,.spot::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;z-index:3}
.spot::before{padding:1px;background:radial-gradient(300px circle at var(--mx) var(--my),rgba(125,211,252,.8),rgba(167,139,250,.35) 35%,transparent 65%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s}
.spot::after{background:radial-gradient(400px circle at var(--mx) var(--my),rgba(56,189,248,.07),transparent 45%);opacity:0;transition:opacity .3s}
.spot:hover::before,.spot:hover::after{opacity:1}

/* ───────── Shell: sidebar ───────── */
.side{position:fixed;inset:0 auto 0 0;width:var(--sidew);z-index:40;background:var(--f1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px 12px;gap:12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.side-top{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.02em;padding:2px 6px}
.brand svg{width:22px;height:22px}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--f2);font-size:12.5px;color:var(--mut);width:100%;text-align:left}
.ws:hover{background:var(--f3)}
.ws i{width:7px;height:7px;border-radius:2px;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.ws b{font-weight:500;color:var(--tx)}
.ws .ic{margin-left:auto;color:var(--dim)}
.cmdk{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--f1);color:var(--dim);font-size:13px;width:100%}
.cmdk:hover{border-color:var(--line-2);color:var(--mut)}
.cmdk kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--line-2);color:var(--mut);background:var(--f2)}
.nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding:2px 0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.zone-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:0 10px 4px;display:flex;align-items:center;width:100%;text-align:left}
button.zone-l{border-radius:6px}button.zone-l:hover{color:var(--mut)}
.zone-l .ic{margin-left:auto;width:12px;height:12px;transition:transform .2s}
.zone.collapsed .zone-l .ic{transform:rotate(-90deg)}
.zone.collapsed .zone-items{display:none}
.zone-items{display:flex;flex-direction:column;gap:1px}
.ni{position:relative;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:13.5px;color:var(--mut);transition:background .15s,color .15s}
.ni:hover{background:rgba(255,255,255,.04);background:var(--f2);color:var(--tx)}
.ni.on{color:var(--tx);background:var(--f3)}
.ni.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:2px;border-radius:0 2px 2px 0;background:var(--grad);box-shadow:0 0 12px rgba(125,211,252,.7)}
.ni.on .ic{color:var(--sky)}
.ni .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.ni.on .cnt{color:var(--mut)}
.side-bot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.user{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px}
.user:hover{background:var(--f2)}
.av-ring{width:34px;height:34px;border-radius:50%;padding:1.5px;background:var(--grad);flex:none}
.av-ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg);font-size:12px;font-weight:600;font-family:var(--mono)}
.user b{display:block;font-weight:500;font-size:13px;line-height:1.2}
.user small{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.guide{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;font-size:12.5px;color:var(--mut);border-radius:8px}
.guide:hover{background:var(--f2);color:var(--tx)}

/* ───────── Shell: app + topbar ───────── */
.app{margin-left:var(--sidew);position:relative;z-index:1;min-height:100vh}
.top{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--topbg);border-bottom:1px solid var(--line);-webkit-backdrop-filter:saturate(160%) blur(16px);backdrop-filter:saturate(160%) blur(16px)}
.crumbs{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--dim);min-width:0}
.crumbs span.sep{opacity:.5}
.crumbs [aria-current]{color:var(--tx)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.dot-n{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 8px var(--rose);border:1.5px solid var(--bg)}
.m-only{display:none}
main{padding:24px 28px 48px;max-width:1680px;display:flex;flex-direction:column;gap:16px}

/* ───────── Page head ───────── */
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px}
.eyebrow i{width:7px;height:7px;border-radius:2px;background:var(--c,var(--sky));box-shadow:0 0 12px var(--c,var(--sky))}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.head h1{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.03em;margin:6px 0 6px}
.sub{font-size:13px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub b{font-family:var(--mono);font-weight:500;color:var(--tx);font-variant-numeric:tabular-nums;font-size:12.5px}
.sub .sp{color:var(--dim)}
.head-r{display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--f2);border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;color:var(--mut);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--f3);color:var(--tx);box-shadow:0 0 0 1px var(--line-2) inset}

/* ───────── Filters ───────── */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative;width:260px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.search input{width:100%;height:32px;border-radius:999px;background:var(--f1);border:1px solid var(--line-2);padding:0 12px 0 33px;font-size:13px;outline:none}
.search input::placeholder{color:var(--dim)}
.search input:focus-visible{border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border-radius:999px;background:var(--f2);border:1px solid var(--line-2);font-size:12.5px;color:var(--mut);white-space:nowrap}
.chip:hover{background:var(--f3);color:var(--tx)}
.chip .ic{width:13px;height:13px}
.chip b{font-weight:500;color:var(--tx)}
.chip.act{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1);color:var(--tx)}
.tog{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px;border-radius:999px;font-size:12.5px;color:var(--mut)}
.tog:hover{color:var(--tx)}
.tog .sw{width:28px;height:16px;border-radius:99px;background:var(--f3);border:1px solid var(--line-2);position:relative;transition:background .2s}
.tog .sw::after{content:"";position:absolute;top:1.5px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--mut);transition:transform .2s var(--ease),background .2s}
.tog[aria-pressed="true"]{color:var(--tx)}
.tog[aria-pressed="true"] .sw{background:rgba(56,189,248,.28);border-color:rgba(56,189,248,.6)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(11px);background:var(--sky)}
.f-spacer{flex:1}
.reset{font-size:12.5px;color:var(--dim);padding:0 6px;height:32px;text-decoration:underline;text-underline-offset:3px}
.reset:hover{color:var(--tx)}
.f-mobile{display:none}

/* ───────── Funnel ───────── */
.funnel{padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-radius:12px}
.fbar{display:flex;gap:3px;height:8px}
.fbar i{display:block;border-radius:99px;background:var(--c);min-width:6px;box-shadow:0 0 14px -2px var(--c);transition:flex-grow .5s var(--ease)}
.leg{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.leg span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.leg i{width:7px;height:7px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
.leg b{font-family:var(--mono);font-weight:500;color:var(--tx);font-variant-numeric:tabular-nums;font-size:12px}
.leg em{font-style:normal;font-family:var(--mono);color:var(--dim);font-size:11px}

/* ───────── Board ───────── */
.stabs{display:none}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding:2px 2px 14px;margin:0 -2px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.col{flex:1 0 296px;min-width:296px;max-width:380px;display:flex;flex-direction:column;gap:8px}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 6px 2px;position:sticky;top:0}
.col-h .d{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
.col-h h2{white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:-.01em}
.col-h .n{font-family:var(--mono);font-size:11px;color:var(--mut);padding:1px 7px;border-radius:99px;background:var(--f2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.col-h .tot{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.col-h .add{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--dim)}
.col-h .add:hover{background:var(--f3);color:var(--tx)}
.col-b{display:flex;flex-direction:column;gap:8px;min-height:120px;padding:4px;margin:-4px;border-radius:14px;border:1px dashed transparent;transition:background .2s,border-color .2s}
.col-b.over{background:rgba(56,189,248,.06);border-color:rgba(56,189,248,.45)}
.empty{border:1px dashed var(--line-2);border-radius:12px;padding:22px 12px;text-align:center;color:var(--dim);font-size:12.5px}
.card{padding:12px;border-radius:12px;cursor:grab;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .2s var(--ease)}
.card:hover{border-color:var(--line-2)}
.card:active{cursor:grabbing}
.card.drag{opacity:.4}
.card.sel{border-color:rgba(56,189,248,.55)}
.card.drop{animation:pop .5s var(--ease)}
@keyframes pop{0%{box-shadow:0 0 0 0 rgba(56,189,248,.6)}100%{box-shadow:0 0 0 10px rgba(56,189,248,0)}}
.c1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.c1 h3{font-size:13.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;white-space:nowrap}
.c-t{font-size:12.5px;color:var(--mut);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;line-height:1;padding:4px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--mut);background:var(--f1)}
.tag.t-web{color:var(--sky);border-color:color-mix(in srgb,var(--sky) 35%,transparent);background:color-mix(in srgb,var(--sky) 9%,transparent)}
.tag.t-cons{color:var(--vio);border-color:color-mix(in srgb,var(--vio) 35%,transparent);background:color-mix(in srgb,var(--vio) 9%,transparent)}
.tag.t-plat{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 35%,transparent);background:color-mix(in srgb,var(--teal) 9%,transparent)}
.c-f{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.nx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.nx span{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx small{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.nx.late small{color:var(--rose)}
.nx.late small::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--rose);box-shadow:0 0 8px var(--rose)}
.pr{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.ring{width:20px;height:20px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.5}
.ring .tr{stroke:var(--line-2)}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:600;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}

/* ───────── Liste ───────── */
.tbl-w{overflow-x:auto;border-radius:var(--r)}
.tbl-w.glass{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:960px;font-size:13px}
th{position:sticky;top:0;text-align:left;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th button{display:flex;align-items:center;gap:6px;width:100%;height:38px;padding:0 12px;text-transform:inherit;letter-spacing:inherit;font:inherit;color:inherit}
th button:hover{color:var(--tx)}
th .ar{opacity:0;width:11px;height:11px;transition:transform .2s}
th[aria-sort] .ar{opacity:1;color:var(--sky)}
th[aria-sort="descending"] .ar{transform:rotate(180deg)}
th.r button{justify-content:flex-end}
td{padding:0 12px;height:48px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--f2)}
tbody tr:last-child td{border-bottom:0}
tbody tr.sel{background:rgba(56,189,248,.07)}
td.r{text-align:right}
td .co{display:flex;flex-direction:column;line-height:1.3;max-width:300px}
td .co b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
td .co span{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:3px 10px 3px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent);color:var(--tx)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.late-t{color:var(--rose)}
.cb{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:5px;border:1px solid var(--line-2);background:var(--f2);display:inline-grid;place-items:center;cursor:pointer;margin:0;vertical-align:middle}
.cb:checked{background:var(--sky);border-color:var(--sky)}
.cb:checked::after{content:"";width:8px;height:4px;border-left:1.8px solid #04050a;border-bottom:1.8px solid #04050a;transform:rotate(-45deg) translate(1px,-1px)}
.cb:indeterminate{background:var(--sky);border-color:var(--sky)}
.cb:indeterminate::after{content:"";width:8px;height:2px;background:#04050a}
td.ck,th.ck{width:44px;padding-left:16px}

.bulk{position:fixed;left:calc(var(--sidew) + (100vw - var(--sidew))/2);bottom:24px;transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:45;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--sheet);border:1px solid var(--line-2);box-shadow:0 20px 60px -10px rgba(0,0,0,.8),0 0 0 1px rgba(56,189,248,.15);transition:transform .35s var(--ease),opacity .25s;max-width:calc(100vw - 24px)}
.bulk.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.bulk .cn{font-size:12.5px;white-space:nowrap}.bulk .cn b{font-family:var(--mono);color:var(--sky)}
.bulk select{height:30px;border-radius:99px;background:var(--f2);border:1px solid var(--line-2);padding:0 10px;font-size:12.5px;color-scheme:dark}
:root[data-theme="light"] .bulk select{color-scheme:light}
.bulk .x{margin-left:2px}

/* ───────── Drawer ───────── */
.scrim{position:fixed;inset:0;z-index:55;background:rgba(2,3,8,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;z-index:60;background:var(--sheet);border-left:1px solid var(--line-2);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .4s var(--ease);box-shadow:-30px 0 80px -30px rgba(0,0,0,.8)}
.drawer::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,var(--f2),transparent 40%)}
.drawer.on{transform:none}
.dr-h{position:relative;padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dr-h .row{display:flex;align-items:flex-start;gap:12px}
.dr-h h2{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.dr-h p{font-size:13px;color:var(--mut)}
.dr-h .x{margin-left:auto;margin-top:-4px;margin-right:-6px}
.dr-b{position:relative;flex:1;overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:10px 12px;border-radius:10px;background:var(--f1);border:1px solid var(--line)}
.kpi small{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.kpi b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500}
.sec-t{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.steps{display:flex;gap:4px}
.steps button{flex:1;display:flex;flex-direction:column;gap:6px;text-align:left;padding:0}
.steps button i{height:4px;border-radius:99px;background:var(--line-2);transition:background .3s,box-shadow .3s}
.steps button span{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button.done i{background:color-mix(in srgb,var(--c) 70%,transparent)}
.steps button.cur i{background:var(--c);box-shadow:0 0 12px var(--c)}
.steps button.cur span{color:var(--tx);font-weight:500}
.steps button:hover span{color:var(--tx)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa .btn{padding:0 8px;gap:6px;font-size:12.5px}
.contact{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--f1);border:1px solid var(--line)}
.contact .av{width:36px;height:36px;font-size:12px}
.contact b{display:block;font-weight:500}
.contact small{color:var(--mut);font-size:12px;display:block}
.contact .links{font-family:var(--mono);font-size:11.5px;color:var(--mut);margin-top:4px;display:flex;flex-direction:column;gap:1px}
.next{padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--sky) 35%,transparent);background:color-mix(in srgb,var(--sky) 8%,transparent);display:flex;flex-direction:column;gap:2px}
.next.late{border-color:color-mix(in srgb,var(--rose) 45%,transparent);background:color-mix(in srgb,var(--rose) 9%,transparent)}
.next b{font-weight:500}
.next small{font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.next.late small{color:var(--rose)}
.tl{position:relative;display:flex;flex-direction:column;gap:16px;padding-left:20px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--c);box-shadow:0 0 10px -1px var(--c)}
.tl b{font-weight:500;font-size:13px;display:block}
.tl span{font-size:12.5px;color:var(--mut);display:block}
.tl time{font-family:var(--mono);font-size:11px;color:var(--dim)}
.props{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.props div{display:flex;flex-direction:column;font-size:13px}
.props small{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}

/* ───────── Popover / sheets ───────── */
.pop{position:fixed;z-index:80;min-width:200px;padding:6px;border-radius:12px;background:var(--sheet);border:1px solid var(--line-2);box-shadow:0 24px 60px -10px rgba(0,0,0,.8);display:none}
.pop.on{display:block}
.pop button{display:flex;align-items:center;width:100%;height:32px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--mut);text-align:left;gap:8px}
.pop button:hover{background:var(--f3);color:var(--tx)}
.pop button[aria-checked="true"]{color:var(--tx)}
.pop button[aria-checked="true"]::after{content:"";margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--sky);box-shadow:0 0 8px var(--sky)}
.sheet{position:fixed;inset:0;z-index:70;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(2,3,8,.6)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;background:var(--sheet);border:1px solid var(--line-2);border-bottom:0;padding:8px 16px calc(20px + var(--safe));animation:up .35s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 12px}
.pn h2{font-size:16px;font-weight:600;margin-bottom:12px}
.fg{margin-bottom:16px}
.fg .opts{display:flex;flex-wrap:wrap;gap:6px}
.fg .opts button{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--f2);color:var(--mut);font-size:13px}
.fg .opts button[aria-checked="true"]{color:var(--tx);border-color:rgba(56,189,248,.6);background:rgba(56,189,248,.12)}

/* ───────── Tab bar + Plus sheet (mobile) ───────── */
.tabbar{display:none}
.plus{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;padding:0 16px calc(24px + var(--safe))}
.plus.on{display:flex}

.plus .ni{height:44px;border:1px solid var(--line);background:var(--f1);border-radius:12px}

/* ───────── Responsive ───────── */
@media (max-width:1180px){.search{width:200px}}
/* Rail 768–1023 */
@media (min-width:768px) and (max-width:1023px){
  :root{--sidew:64px}

  .ws{width:36px;height:36px;padding:0;justify-content:center}

  .ni:hover::after,.ni:focus-visible::after,.guide:hover::after,.cmdk:hover::after{opacity:1}
  .guide,.cmdk{position:relative;justify-content:center;padding:0;width:36px}
  .side-bot{align-items:center}.user{padding:0}
  .top{padding:0 20px}main{padding:20px 20px 48px}

/* ── Données ── */

const W='Site web',C='Conseil',P='Plateforme';
const L=[
 [1,'Maison Delacroix','Refonte du site vitrine et catalogue',14500,20,0,'Recommandation','RB',[W],'Appel de qualification','2026-11-03','Claire Delacroix','Gérante'],

 [12,'Normand Immobilier','Refonte du site et CRM sur mesure',27000,50,2,'Site web','TD',[W,P],'Présenter la proposition','2026-11-10','Bruno Normand','Gérant'],
 [13,'Maison Verlaine','Plateforme e-commerce B2B',72000,75,3,'Partenaire','RB',[P,W],'Appel de contractualisation','2026-11-03','Camille Verlaine','Présidente'],

 [15,'Studio Hélios','Site business et référencement',16800,80,3,'Recommandation','ML',[W,C],'Envoyer le devis final','2026-11-06','Léa Hélios','Fondatrice'],

function setTab(t,focus){
 tab=t;const T=TABS[t];
 $$('#ctabs button').forEach(b=>{const on=b.dataset.t===t;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;if(on&&focus)b.focus()});
 ['pipe','cli','par'].forEach(k=>$('#p-'+k).hidden=k!==t);
 $('#segV').hidden=t!=='pipe';
 $('#ctaL').textContent=T.cta;$('#crumbT').textContent=T.crumb;
 if(t==='pipe')render();else $('#sub').innerHTML=T.sub;
 closePop();closeWs();
 if(t!=='pipe'){closeDrawer();$('#fsheet').classList.remove('on')}
 renderBulk();
}
$('#ctabs').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b)setTab(b.dataset.t)});
$('#ctabs').addEventListener('keydown',e=>{
 const o=['pipe','cli','par'],i=o.indexOf(tab);
 if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();setTab(o[(i+(e.key==='ArrowRight'?1:2))%3],true)}
});

/* ── Sélecteur d’espace de travail ── */
const wsP=$('#wsPop'),wsB=$('#wsB');
const WS=[['Venio · Paris','',true],['Venio Formation','v',false],['Venio Studio','s',false]];
function wsHTML(){
 return `<button type="button" role="menuitem" data-w="all">${ic('grid')}<span>Vue portefeuille</span><small class="num" style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)">Super admin</small></button><hr><div class="wl">Filiales</div>`+
 WS.map(([n,c,cur])=>`<button type="button" role="menuitemradio" aria-checked="${cur}" data-w="${esc(n)}"><i class="${c}"></i><span>${n}</span>${cur?`<span class="ck">${ic('check')}</span>`:''}</button>`).join('');
}
function openWs(){
 wsP.innerHTML=wsHTML();wsP.classList.add('on');wsB.setAttribute('aria-expanded','true');
 const r=wsB.getBoundingClientRect();
 wsP.style.top=(r.bottom+6)+'px';wsP.style.left=Math.max(8,Math.min(r.left,innerWidth-wsP.offsetWidth-8))+'px';
 const f=wsP.querySelector('button[aria-checked="true"]')||wsP.querySelector('button');f&&f.focus();
}
function closeWs(){if(!wsP.classList.contains('on'))return;wsP.classList.remove('on');wsB.setAttribute('aria-expanded','false')}
wsB.addEventListener('click',e=>{e.stopPropagation();wsP.classList.contains('on')?closeWs():openWs()});
wsP.addEventListener('click',e=>{if(e.target.closest('button')){closeWs();wsB.focus()}});
document.addEventListener('click',e=>{if(wsP.classList.contains('on')&&!wsP.contains(e.target))closeWs()});
addEventListener('resize',closeWs);

syncFilters();buildSheet();render();
})();
</script>
</body>
</html>
