name: 🚀 Déploiement automatique sur VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    name: Build et déploiement sur VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🔐 Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Déployer via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOY'
            set -e
            cd /opt/docker/openclaw/config/workspace/projects/venio
            echo "📥 Pull du code..."
            git fetch origin main
            git reset --hard origin/main
            echo "🏗️ Rebuild du container..."
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Fix Nginx config: proxy to Docker container instead of serving static files
            NGINX_CONF="/etc/nginx/sites-available/venio.pro"
            if ! grep -q "proxy_pass" "$NGINX_CONF" 2>/dev/null; then
              echo "🔧 Mise a jour de la config Nginx pour proxy vers Docker..."
              cat > "$NGINX_CONF" << 'NGINX'
            server {
                listen 127.0.0.1:8200;
                server_name venio.pro www.venio.pro;

                location / {
                    proxy_pass http://127.0.0.1:4000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            NGINX
              nginx -t && systemctl reload nginx
              echo "✅ Nginx mis a jour et recharge"
            else
              echo "✅ Nginx config deja en mode proxy"
            fi

            echo "✅ Déploiement terminé"
          DEPLOY

      - name: 📋 Logs du container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'LOGS'
            sleep 15
            echo "=== Docker container status ==="
            docker ps -a --filter name=venio --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "=== Last 80 lines of logs ==="
            docker logs venio --tail 80 2>&1
            echo "=== Public dir contents ==="
            docker exec venio ls -la /app/public/ 2>&1 | head -20
            echo "=== Health check ==="
            docker exec venio wget -qO- http://localhost:4000/api/health 2>&1 || true
            echo "=== Curl from host ==="
            curl -s -o /dev/null -w "localhost:4000 => HTTP %{http_code}\n" http://localhost:4000/ || true
            echo "=== Nginx config for venio ==="
            cat /etc/nginx/sites-enabled/venio* 2>/dev/null || cat /etc/nginx/conf.d/venio* 2>/dev/null || echo "No venio nginx config found"
            echo "=== Nginx default config ==="
            grep -r "venio\|4000\|3000" /etc/nginx/ 2>/dev/null | head -20 || true
            echo "=== Nginx status ==="
            nginx -t 2>&1 || true
          LOGS

      - name: ✅ Vérifier le site
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://venio.pro)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Site en ligne sur https://venio.pro (HTTP $STATUS)"
          else
            echo "⚠️ Le site a répondu avec HTTP $STATUS"
          fi
