name: 🚀 Déploiement automatique sur VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    name: Build et déploiement sur VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🔐 Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Déployer via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOY'
            set -e
            PROJECT_DIR="/opt/docker/openclaw/config/workspace/projects/venio"

            # Recreer le dossier si necessaire
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "📂 Dossier projet introuvable, re-clonage..."
              mkdir -p "$(dirname $PROJECT_DIR)"
              rm -rf "$PROJECT_DIR"
              git clone https://github.com/raphaelbentv/Venio.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # Sauvegarder le .env existant s'il existe
            if [ -f .env ]; then
              cp .env .env.backup
            fi

            # Recuperer les env vars du container existant si pas de .env
            if [ ! -f .env ]; then
              CONTAINER_ID=$(docker ps -q --filter name=venio 2>/dev/null | head -1)
              if [ -n "$CONTAINER_ID" ]; then
                echo "🔑 Recuperation des env vars du container existant..."
                docker exec "$CONTAINER_ID" env 2>/dev/null | grep -E '^(JWT_SECRET|MONGODB_URI|CORS_ORIGIN|SMTP_|ENCRYPTION_KEY|NODE_ENV)=' > .env 2>/dev/null || true
              fi
            fi

            echo "📥 Pull du code..."
            git fetch origin main
            git reset --hard origin/main

            # Restaurer le .env apres le reset
            if [ -f .env.backup ]; then
              mv .env.backup .env
            fi

            # Arreter tout container venio existant (ancien ou nouveau)
            echo "🛑 Arret des anciens containers..."
            docker compose -f docker-compose.prod.yml down 2>/dev/null || true
            docker stop venio-app 2>/dev/null || true
            docker rm venio-app 2>/dev/null || true

            echo "🏗️ Rebuild du container..."
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            # Ensure Nginx proxies to Docker container
            if [ -f nginx/venio.pro.conf ]; then
              cp nginx/venio.pro.conf /etc/nginx/sites-available/venio.pro
              killall -HUP nginx 2>/dev/null || true
            fi

            echo "✅ Déploiement terminé"
          DEPLOY

      - name: ✅ Vérifier le site
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://venio.pro)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Site en ligne sur https://venio.pro (HTTP $STATUS)"
          else
            echo "⚠️ Le site a répondu avec HTTP $STATUS"
          fi
