name: 🚀 Déploiement automatique sur VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    name: Build et déploiement sur VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🔐 Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Déployer via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOY'
            set -e
            cd /opt/docker/openclaw/config/workspace/projects/venio
            echo "📥 Pull du code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🏗️ Rebuild du container..."
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Ensure Nginx proxies to Docker container
            NGINX_CONF="/etc/nginx/sites-available/venio.pro"
            echo "🔧 Mise a jour Nginx config..."
            cp nginx/venio.pro.conf "$NGINX_CONF"
            nginx -t
            # Try all known ways to reload nginx
            systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null || killall -HUP nginx 2>/dev/null || true
            echo "✅ Nginx config applied"
            # Debug: show what processes listen on 8200
            ss -tlnp | grep 8200 || echo "Nothing listening on 8200"
            echo "=== Curl port 8200 ==="
            curl -s -o /dev/null -w "localhost:8200 => HTTP %{http_code}\n" http://localhost:8200/ || true
            curl -s http://localhost:8200/ | head -5 || true
            echo "=== Docker compose config ==="
            cat docker-compose.prod.yml 2>/dev/null || echo "No docker-compose.prod.yml"

            echo "✅ Déploiement terminé"
          DEPLOY

      - name: 📋 Logs du container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'LOGS'
            sleep 10
            echo "=== Container status ==="
            docker ps -a --filter name=venio --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "=== Last 30 lines ==="
            docker logs venio --tail 30 2>&1
          LOGS

      - name: ✅ Vérifier le site
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://venio.pro)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Site en ligne sur https://venio.pro (HTTP $STATUS)"
          else
            echo "⚠️ Le site a répondu avec HTTP $STATUS"
          fi
