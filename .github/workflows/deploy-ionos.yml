name: 🚀 Déploiement automatique sur Ionos

on:
  push:
    branches:
      - main  # Déploie automatiquement quand vous poussez sur main
    paths-ignore:
      - 'README.md'
      - 'DEPLOY_IONOS.md'
      - '.gitignore'
  workflow_dispatch:  # Permet de déclencher manuellement depuis GitHub

jobs:
  deploy:
    name: Build et déploiement sur Ionos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Installer les dépendances
        run: npm ci --include=dev

      - name: 🔧 Configurer l'environnement de build
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "Build environment configured"

      - name: 🏗️ Build du projet
        run: npm run build:ionos

      - name: ✅ Vérifier le build
        run: npm run deploy:check

      - name: 🔎 Vérifier le contexte git
        run: |
          if [ ! -d .git ]; then
            echo "::error::.git directory missing before deploy"
            exit 1
          fi
          git rev-parse --is-inside-work-tree
          if [ -f .git/shallow ]; then
            git fetch --prune --unshallow
          else
            git fetch --prune
          fi
          git log --oneline -n 1

      - name: 🔐 Vérifier les secrets et le dossier de build
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=0
          for key in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!key}" ]; then
              echo "::error::Secret manquant ou vide: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ ! -d "${{ github.workspace }}/dist" ]; then
            echo "::error::Dossier de build introuvable: ${{ github.workspace }}/dist"
            exit 1
          fi

      - name: 🚀 Déployer sur Ionos via SFTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: 'sftp'
          remote-host: ${{ secrets.FTP_SERVER }}
          remote-user: ${{ secrets.FTP_USERNAME }}
          remote-password: ${{ secrets.FTP_PASSWORD }}
          remote-port: 22
          remote-path: ${{ secrets.FTP_SERVER_DIR }}
          local-path: ${{ github.workspace }}/dist
          sync: 'full'

      - name: ✅ Déploiement terminé
        run: |
          echo "✅ Site déployé avec succès sur https://venio.pro"
          echo "🔄 Les modifications peuvent prendre quelques minutes à apparaître"
