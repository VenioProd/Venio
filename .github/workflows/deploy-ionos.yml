name: 🚀 Déploiement Ionos (master — DÉCLENCHEMENT MANUEL UNIQUEMENT)

# IMPORTANT — La branche master est legacy. Le déploiement automatique est
# désactivé pour éviter d'écraser la prod (qui tourne désormais sur main).
# Pour déployer cette branche : "Run workflow" depuis l'interface GitHub.

on:
  workflow_dispatch:  # Déclenchement manuel uniquement

jobs:
  deploy:
    name: Build et déploiement sur Ionos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Installer les dépendances
        run: npm ci --include=dev

      - name: 🔧 Configurer l'environnement de build
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "Build environment configured"

      - name: 🏗️ Build du projet
        run: npm run build:ionos

      - name: ✅ Vérifier le build
        run: npm run deploy:check

      - name: 🔎 Vérifier le contexte git et les artefacts
        run: |
          if [ ! -d .git ]; then
            echo "::error::.git directory missing before deploy"
            exit 1
          fi
          if [ ! -d dist ]; then
            echo "::error::dist directory missing before deploy"
            exit 1
          fi
          git rev-parse --is-inside-work-tree
          git fetch --prune --unshallow || true
          git log --oneline -n 1
          ls -la dist | head

      - name: 🚀 Déployer sur Ionos via SFTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: 'sftp'
          remote-host: ${{ secrets.FTP_SERVER }}
          remote-user: ${{ secrets.FTP_USERNAME }}
          remote-password: ${{ secrets.FTP_PASSWORD }}
          remote-port: 22
          remote-path: ${{ secrets.FTP_SERVER_DIR }}
          local-path: './dist'
          sync: 'full'

      - name: ✅ Déploiement terminé
        run: |
          echo "✅ Site déployé avec succès sur https://venio.paris"
          echo "🔄 Les modifications peuvent prendre quelques minutes à apparaître"
