name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (typecheck + lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        run: npm --prefix backend ci

      - name: Typecheck (frontend + backend)
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint
      # NB: `npm run format:check` non bloquant pour l'instant — Prettier appliqué progressivement
      # via le hook pre-commit (lint-staged). À activer en CI bloquante après un format big-bang.

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        run: npm --prefix backend ci

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Run backend tests
        run: npm run test:backend

  public-site-recipe:
    name: Public site recipe (SEO + a11y + perf + responsive)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root deps
        run: npm ci

      - name: Install Chromium for local responsive recipe
        run: npx playwright install --with-deps chromium

      - name: Run public recipe
        run: npm run test:public

      - name: Upload responsive captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-responsive-captures
          path: test-results/public-captures
          if-no-files-found: warn
