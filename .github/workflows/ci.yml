name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (typecheck + lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        run: npm --prefix backend ci

      - name: Typecheck (frontend + backend)
        run: npm run typecheck:all

      # Plafond d'avertissements : il ne doit que baisser. Le réduire à chaque nettoyage.
      - name: Lint
        run: npm run lint -- --max-warnings 769

      - name: Format
        run: npm run format:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        run: npm --prefix backend ci

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Run backend tests
        run: npm run test:backend

  public-site-recipe:
    name: Public site recipe (SEO + a11y + perf + responsive)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root deps
        run: npm ci

      - name: Install Chromium for local responsive recipe
        run: npx playwright install --with-deps chromium

      - name: Run public recipe
        run: npm run test:public

      - name: Upload responsive captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-responsive-captures
          path: test-results/public-captures
          if-no-files-found: warn

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
      - if: always()
        run: npm --prefix backend audit --omit=dev --audit-level=high

  connected-crm:
    name: Connected CRM smoke test
    runs-on: ubuntu-latest
    # Jamais encore exécuté en CI : non bloquant tant qu'il n'a pas fait ses preuves.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npx playwright install --with-deps chromium
      - name: Admin login and lead table
        run: npx playwright test e2e/connected-crm.spec.ts
        env:
          VENIO_E2E_CONNECTED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: connected-crm-results
          path: test-results
          if-no-files-found: ignore
